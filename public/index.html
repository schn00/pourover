<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dialed</title>
<meta name="apple-mobile-web-app-title" content="Dialed">
<meta name="theme-color" content="#F4F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1117" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  --sheet:#FBFBFC;--shell:#F4F5F8;--surface:#FFFFFF;
  --ink:#14161F;--muted:#7A7F8E;--faint:#8C90A0;--ghost:#C2C6D2;
  --line:#E6E8EF;--hair:#EDEFF4;
  --accent:#2F5BFF;--accent-ink:#FFFFFF;--accent-soft:#E7ECFF;--accent-text:#2340CC;--accent-on-ink:#A8BCFF;
  --sour-deep:#E8A21C;
  --band-bg:#16276B;--band-ink:#FFFFFF;--band-dim:#AFC0EA;
  --clay:#B0603C;--btn-bg:#16276B;--btn-fg:#FFFFFF;--rail:#A9AEBC;
  --lime:#C6F432;--frozen-bg:#DDF4FA;--frozen-text:#0B6F86;--good:#1F9D57;--warn:#C0442A;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --t-title:17px;--t-name:17.5px;--t-num:19px;--t-field:24px;--t-sub:19px;--t-detail:15px;--t-lab:12.5px;--t-unit:11.5px;
  --h-num:40px;--h-sub:34px;--h-det:36px;
  --warm-soft:#FAEEDA;--warm-line:#EF9F27;--warm-text:#854F0B;--accent-line:#85B7EB;
  color-scheme:light;
}
[data-theme="dark"]{
  --sheet:#0F1117;--shell:#14161F;--surface:#171A23;
  --ink:#E8EAF2;--muted:#9AA0B2;--faint:#767C8C;--ghost:#4A5060;
  --line:#262A37;--hair:#1F232E;
  --accent:#7090FF;--accent-ink:#0A0F2E;--accent-soft:#1B2447;--accent-text:#AFC0FF;--accent-on-ink:#A9BEFF;
  --sour-deep:#E0B03A;
  --band-bg:#1B1F2B;--band-ink:#E8EAF2;--band-dim:#8A90A2;
  --clay:#D08A66;--btn-bg:#E8EAF2;--btn-fg:#0F1117;--rail:#4A5060;
  --frozen-bg:#0F3340;--frozen-text:#7FDCF0;--good:#4ADE80;--warn:#FF8A5B;
  --warm-soft:#3A2A0B;--warm-line:#8A6212;--warm-text:#F0C777;--accent-line:#3C4E8A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sheet);color:var(--ink);font:400 14px/1.5 var(--font);font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;min-height:100dvh}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-size:20px;line-height:1.2;font-weight:600;letter-spacing:-0.01em;margin:0}
h2{font-size:var(--t-lab);font-weight:600;color:var(--faint);margin:0 0 8px;letter-spacing:.02em}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell: brand bar + page band, stuck together ---------- */
#chrome{position:sticky;top:0;z-index:6}
.top{display:flex;align-items:center;gap:10px;padding:8px 16px;padding-top:max(8px,env(safe-area-inset-top));
  background:var(--shell);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:-0.025em;margin-right:auto}
.brand .logo{width:23px;height:23px;border-radius:6px;flex:none}
.status{display:grid;place-items:center;width:30px;height:30px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer}
.status i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status[data-s="synced"] i{background:var(--good)}
.status[data-s="saving"] i{background:var(--accent)}
.status[data-s="offline"] i,.status[data-s="error"] i,.status[data-s="signin"] i{background:var(--warn)}
.iconbtn{display:grid;place-items:center;width:30px;height:30px;border:0;background:none;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--ink)}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.band{background:var(--band-bg);color:var(--band-ink)}
.bandfull{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:11px 16px 10px;
  max-height:56px;overflow:hidden;opacity:1;transition:max-height .18s ease,opacity .12s ease,padding .18s ease}
.bandtitle{font-size:var(--t-title);font-weight:600;font-stretch:125%;letter-spacing:-0.005em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.bandright{display:flex;align-items:baseline;gap:12px;flex:none}
.bandmini{display:flex;align-items:baseline;gap:8px;padding:0 16px;max-height:0;overflow:hidden;opacity:0;
  transition:max-height .18s ease,opacity .12s ease,padding .18s ease}
.mininame{font-size:14px;font-weight:600;white-space:nowrap;flex:none;max-width:44%;overflow:hidden;text-overflow:ellipsis}
.minifacts{font-size:12.5px;color:var(--band-dim);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;flex:1 1 auto;min-width:0}
.minidate{font-size:12.5px;font-weight:500;color:var(--accent-on-ink);flex:none}
#chrome.scrolled .band[data-collapse] .bandfull{max-height:0;opacity:0;padding-top:0;padding-bottom:0}
#chrome.scrolled .band[data-collapse] .bandmini{max-height:40px;opacity:1;padding-top:8px;padding-bottom:9px}
.banddate{display:inline-flex;flex:none}
.banddate input{all:unset;font:inherit;font-size:13px;font-weight:500;color:var(--accent-on-ink);
  cursor:pointer;text-align:right}
.banddate input::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.45;cursor:pointer}
.bandbtn{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:var(--accent-on-ink)}
.bandnote{font-size:13px;color:var(--band-dim)}
.bandsel{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:var(--accent-on-ink)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;background:var(--shell);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;cursor:pointer;font:inherit;display:flex;flex-direction:column;
  align-items:center;gap:2px;padding:7px 4px 6px;font-size:11.5px;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.tabs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
main{max-width:720px;margin:0 auto;padding:10px 16px 96px}
@media (min-width:900px){
  body{padding-left:84px}
  .tabs{top:0;right:auto;width:84px;flex-direction:column;justify-content:flex-start;gap:2px;padding:64px 0 0;
    border-top:0;border-right:1px solid var(--line)}
  .tabs button{flex:0;padding:11px 4px}
  main{padding-bottom:40px}
}

/* ---------- the sheet: ruled rows, no cards ---------- */
.srow{border-top:1px solid var(--line);padding:10px 0}
.srow:first-child{border-top:0;padding-top:4px}
/* On the log sheet every field already carries its own underline, so a section
   divider on top of that read as two unrelated lines. Space does the grouping. */
#brewForm .srow{border-top:0;padding:16px 0 2px}
#brewForm .srow:first-child{padding-top:4px}
input,select,textarea{width:100%;background:none;border:0;padding:0;appearance:none;-webkit-appearance:none}
/* A transparent select renders its option list on white, which hides light text in dark mode. */
select option,select optgroup{background-color:var(--surface);color:var(--ink)}
main input::placeholder,main textarea::placeholder{color:var(--ghost)}
select::-ms-expand{display:none}

/* numbers: label over value, hairline under */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;align-items:end;position:relative}
.num{display:block;min-width:0;padding-bottom:1px}
.nlab{display:block;font-size:var(--t-lab);color:var(--faint);margin-bottom:1px}
.val{display:flex;align-items:baseline;gap:4px;border-bottom:1px solid var(--hair);min-height:var(--h-num);
  padding-bottom:3px;transition:border-color .12s;cursor:text}
.val input{width:auto;flex:0 1 auto;min-width:2.4ch;align-self:flex-end;caret-color:var(--accent);
  font-size:var(--t-field);line-height:1.4;font-weight:500;font-stretch:112%;letter-spacing:-0.01em}
.val i{font-style:normal;font-size:var(--t-unit);color:var(--faint);font-weight:500}
.val:focus-within{border-bottom-color:var(--accent)}
.val:focus-within input{color:var(--accent-text)}
.num.sub .val{min-height:var(--h-sub)}
.num.sub .val input{font-size:var(--t-sub);font-stretch:100%;letter-spacing:0}
.num.sub .nlab{color:var(--ghost)}
.nudge{margin-left:auto;display:flex;gap:4px;align-self:center}
.nudge button{all:unset;cursor:pointer;width:26px;height:26px;display:grid;place-items:center;border-radius:5px;
  background:var(--hair);color:var(--muted);font-size:14px;line-height:1}
.nudge button:hover{background:var(--accent-soft);color:var(--accent-text)}
.ratio{position:absolute;right:0;top:0;font-size:12.5px;color:var(--accent);font-weight:600}
.ratio.off{color:var(--ghost)}

/* bloom nested above brew time */
.subhead{font-size:11.5px;color:var(--faint);font-weight:600;margin-bottom:2px;letter-spacing:.03em}
.pair.tight{gap:2px 14px;padding-left:10px;border-left:2px solid var(--rail);margin-bottom:7px}

/* text detail lines */
.inline{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
.txt{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--hair);min-height:var(--h-det);
  padding-bottom:4px;min-width:0}
.txt>span{font-size:var(--t-lab);color:var(--faint);flex:none;width:72px;align-self:flex-end;padding-bottom:2px}
.txt input{font-size:var(--t-detail);font-weight:500;min-width:0;align-self:flex-end;padding-bottom:1px}
.txt:focus-within{border-bottom-color:var(--accent)}
.txt.wide{grid-column:1/-1}

/* bag picker + beans block */
.bagpick{display:flex;align-items:center;gap:6px;cursor:pointer;padding:3px 0}
.sbag{font-size:21px;line-height:1.2;font-weight:600;letter-spacing:-0.01em;width:auto;flex:0 1 auto;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-overflow:ellipsis}
.chev{width:16px;height:16px;flex:none;color:var(--faint);fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.bagpick:hover .chev{color:var(--accent)}
.beanmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:7px;font-size:12.5px;
  color:var(--faint)}
.chip{display:inline-flex;align-items:baseline;gap:5px;font-size:12px;font-weight:600;
  padding:2px 7px;border-radius:3px;background:var(--accent-soft);color:var(--accent-text)}
.chip.frozen{background:var(--frozen-bg);color:var(--frozen-text)}
#roastInfo .chip:not(.frozen){background:var(--hair);color:var(--muted)}
.beanline{margin-top:5px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
/* The roaster's own words: italic behind a plain rule, no hue of its own. */
.beannotes{margin-top:7px;padding-left:8px;font-size:var(--t-detail);font-style:italic;color:var(--ink);
  border-left:2px solid var(--clay)}
.thaw{all:unset;cursor:pointer;font-size:12px;font-weight:600;color:var(--frozen-text);
  border-bottom:1px solid currentColor;line-height:1.2}

/* taste */
/* The compass is the only control here that needs precision, so it gets the room. */
.tastegrid{display:block}
.compasscol{max-width:260px;margin:0 auto 14px}
.compasscol>.compass{width:100%}
@media (min-width:560px){.tastegrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:center}
  .compasscol{margin:0}}
.compass{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:2px;overflow:hidden;
  touch-action:none;cursor:crosshair;user-select:none;
  background:
    radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--good) 30%,transparent) 0,
      color-mix(in srgb,var(--good) 12%,transparent) 26%,transparent 46%),
    linear-gradient(to right,color-mix(in srgb,var(--sour-deep) 40%,transparent),transparent 44%,
      transparent 56%,color-mix(in srgb,var(--accent) 34%,transparent)),
    linear-gradient(to bottom,color-mix(in srgb,var(--ink) 12%,transparent),transparent 42%,
      transparent 58%,color-mix(in srgb,var(--ink) 7%,transparent))}
.compass .zone{position:absolute;left:37.5%;top:37.5%;width:25%;height:25%;border-radius:50%;z-index:2;
  border:1px dashed color-mix(in srgb,var(--good) 55%,transparent)}
.compass::before,.compass::after{content:"";position:absolute;z-index:1;
  background:color-mix(in srgb,var(--ink) 12%,transparent)}
.compass::before{left:50%;top:0;bottom:0;width:1px}
.compass::after{top:50%;left:0;right:0;height:1px}
.compass .ax{position:absolute;font-size:11.5px;color:var(--muted);pointer-events:none;z-index:3;
  background:color-mix(in srgb,var(--sheet) 74%,transparent);padding:0 3px;border-radius:2px}
.ax.t{top:3px;left:50%;transform:translateX(-50%)}
.ax.b{bottom:3px;left:50%;transform:translateX(-50%)}
.ax.l{left:3px;top:50%;transform:translateY(-50%)}
.ax.r{right:3px;top:50%;transform:translateY(-50%)}
.compass .dot{position:absolute;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;
  background:var(--ink);border:2px solid var(--sheet);box-shadow:0 0 0 1px var(--ink);z-index:4;
  transition:left .08s,top .08s}
.tapme{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;
  color:var(--muted);pointer-events:none;z-index:3;background:color-mix(in srgb,var(--sheet) 80%,transparent);
  padding:1px 5px;border-radius:2px}
.ratelabel{font-size:var(--t-lab);color:var(--faint)}
.ratelabel b{font-size:var(--t-field);font-stretch:112%;font-weight:500;color:var(--ink);margin-left:5px}
.ratelabel b.off{color:var(--ghost)}
.rate{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin-top:6px}
.rate button{all:unset;height:34px;border-radius:2px;background:var(--hair);cursor:pointer;text-align:center;
  font-size:14px;color:var(--faint);line-height:34px}
.rate button:hover{background:var(--accent-soft);color:var(--accent-text)}
.rate button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.rate-ends{display:flex;justify-content:space-between;margin-top:5px;font-size:11.5px;color:var(--faint)}
.tastesaid{margin-top:7px;font-size:var(--t-detail);color:var(--muted)}
.tastesaid button{all:unset;cursor:pointer;color:var(--accent);margin-left:8px;border-bottom:1px solid currentColor;
  font-size:12.5px;font-weight:600}
.notesf{display:block;margin-top:11px}
.snotes{display:block;font-size:var(--t-detail);line-height:1.45;min-height:40px;border-bottom:1px solid var(--hair);
  padding-bottom:4px;resize:vertical}
.snotes:focus{border-bottom-color:var(--accent)}

/* actions */
.saverow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:12px 15px;border-radius:2px;
  border:1px solid var(--accent);color:var(--accent);font-size:13.5px;font-weight:600;display:inline-block}
.btn:hover{background:var(--accent-soft);color:var(--accent-text)}
.btn.primary{flex:1 1 auto;background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg);font-weight:600;font-stretch:112%}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.danger:hover{background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn)}
.btn.sm{padding:8px 11px;font-size:12.5px}
.linkbtn{all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--accent);
  border-bottom:1px solid currentColor;display:inline-block}
.linkbtn:hover{color:var(--accent-text)}
.acts{display:flex;flex-wrap:wrap;gap:16px;margin-top:11px}
.selline{display:flex;align-items:baseline;gap:8px;min-width:0}
.selline>span{font-size:var(--t-lab);color:var(--faint);flex:none}
.selline select,.selline input{font-size:var(--t-detail);font-weight:500;cursor:pointer;
  border-bottom:1px solid var(--hair);padding-bottom:2px;flex:1 1 auto;min-width:0}
.selline select{background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),
  linear-gradient(135deg,var(--faint) 50%,transparent 50%);background-position:calc(100% - 6px) 60%,calc(100% - 2px) 60%;
  background-size:4px 4px;background-repeat:no-repeat;padding-right:14px}
.selline input{cursor:text}
.selpair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.empty{text-align:center;padding:40px 8px}
.empty h1{margin-bottom:6px}
.empty p{color:var(--muted);margin-bottom:18px;font-size:13px}

/* ---------- lists of items: Bags, Recipes ---------- */
.list{padding:2px 0}
.item{padding:13px 0 15px;position:relative}
.item::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:2px;background:var(--line)}
.item.mine::before{background:var(--accent)}
.item>*{padding-left:14px}
.item+.item{border-top:1px solid var(--hair)}
.item.plain::before{display:none}
.item.plain>*{padding-left:0}
.iname{display:block;font-size:var(--t-name);font-weight:600;letter-spacing:-0.01em;overflow-wrap:anywhere}
.iby{display:block;font-size:12.5px;color:var(--faint)}

/* recipe specs on one line, pours one per line */
.rxspecs{display:flex;gap:0 6px;margin-top:9px}
.rxspecs span{flex:1 1 0;min-width:0;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rxspecs i{display:block;font-style:normal;font-size:11.5px;color:var(--faint);font-weight:400;letter-spacing:.01em}
.pours{margin-top:10px;border-top:1px solid var(--hair)}
.prow{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px solid var(--hair)}
.prow:last-child{border-bottom:0}
.pn{flex:none;width:15px;height:15px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);
  font-size:9.5px;font-weight:700;display:inline-grid;place-items:center;align-self:center}
.pn.none{background:none;color:var(--ghost)}
.pt{flex:none;width:36px;font-size:12.5px;font-weight:600}
.pnote{flex:1 1 auto;min-width:0;font-size:12.5px;color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.pnote.step{color:var(--accent-text);font-style:italic}
.pg{flex:none;font-size:14.5px;font-weight:500;font-stretch:112%;letter-spacing:-0.01em}
.pg.none{color:var(--ghost);font-size:12px}

/* ---------- History ---------- */
.hrow{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;
  border-top:1px solid var(--hair);padding:9px 0}
.hrow:first-child{border-top:0}
.hrow:hover{background:color-mix(in srgb,var(--line) 22%,transparent)}
.hrate{font-size:var(--t-num);font-weight:500;font-stretch:112%;width:26px;flex:none;text-align:right;color:var(--ink)}
.hrate.hi{color:var(--accent-text)}
.hrate.lo{color:var(--muted)}
.hrate.none{color:var(--ghost)}
.hbody{display:block;min-width:0;flex:1 1 auto}
.h1{display:block;font-size:var(--t-detail);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h2{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdate{font-size:12px;color:var(--faint);flex:none}

/* ---------- Insights ---------- */
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{display:block;font-size:var(--t-num);font-weight:500;font-stretch:112%;letter-spacing:-0.01em;overflow-wrap:anywhere}
.stat.name{font-size:13px;font-stretch:100%;font-weight:600;line-height:1.25}
.stat i{display:block;font-style:normal;font-size:11.5px;color:var(--faint);font-weight:400}
.factor{margin-bottom:12px}
.factor:last-of-type{margin-bottom:0}
.fh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fh b{font-size:var(--t-detail);font-weight:600}
.fh span{font-size:11.5px;color:var(--faint);white-space:nowrap}
.factor p{margin:2px 0 5px;font-size:13.5px;color:var(--muted)}
.bar{height:3px;background:var(--hair);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.foot{margin-top:10px;font-size:12px;color:var(--faint)}
svg.chart{width:100%;height:auto;display:block;margin-top:10px}
svg.chart text{fill:var(--faint);font-size:9.5px;font-family:var(--font)}
svg.chart .grid-l{stroke:var(--hair)}
svg.chart .pt{fill:var(--accent);fill-opacity:.55;stroke:var(--accent);stroke-opacity:.5}

/* ---------- brew detail ---------- */
.score{display:flex;align-items:baseline;gap:12px}
.score b{font-size:38px;line-height:1;font-weight:500;font-stretch:112%;letter-spacing:-0.03em}
.score b.off{color:var(--ghost)}
.score small{font-size:12.5px;color:var(--faint);font-weight:500}
.score .said{font-size:var(--t-detail);font-weight:600}
/* ---------- section strips: full-bleed, tinted, one hue per meaning ---------- */
.sect{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 -16px;padding:9px 16px;
  background:var(--accent-soft);color:var(--accent-text);border-top:1px solid var(--accent-line);
  border-bottom:1px solid var(--accent-line);font-size:var(--t-lab);font-weight:600;letter-spacing:.03em}
.sect.under{background:var(--warm-soft);color:var(--warm-text);border-color:var(--warm-line)}
.sect.flat{background:var(--hair);color:var(--muted);border-color:var(--line)}
.sect .diag{font-weight:600;letter-spacing:0}
.sect+.srow{border-top:0}
.leadline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lead{font-size:19px;font-weight:600;line-height:1.3}
.change{font-size:19px;font-weight:600;letter-spacing:-0.01em;white-space:nowrap;border-radius:3px;padding:1px 8px;
  background:var(--accent-soft);color:var(--accent-text)}
.change.under{background:var(--warm-soft);color:var(--warm-text)}
.why{color:var(--muted);font-size:var(--t-detail);line-height:1.45;margin-top:5px}
.subrule{margin-top:14px;padding-bottom:6px;font-size:var(--t-lab);font-weight:600;letter-spacing:.03em;
  color:var(--accent-text);border-bottom:1px solid var(--accent-line)}
.subrule.under{color:var(--warm-text);border-bottom-color:var(--warm-line)}
.subrule.flat{color:var(--muted);border-bottom-color:var(--line)}
.tip{padding:10px 0;border-bottom:1px solid var(--hair)}
.tip:last-child{border-bottom:0}
.tip b{display:block;font-size:15px;font-weight:600;line-height:1.35}
.tip span{display:block;margin-top:2px;font-size:13.5px;line-height:1.4;color:var(--muted)}
details.rx>summary{list-style:none;cursor:pointer}
details.rx .srow{border-top:0}
details.rx>summary::-webkit-details-marker{display:none}
details.rx>summary .chev{transition:transform .15s ease}
details.rx[open]>summary .chev{transform:rotate(180deg)}
.note{margin-top:9px;font-size:var(--t-detail);line-height:1.45;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 16px;margin:0}
@media (min-width:560px){.facts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.facts div{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--hair);padding:5px 0;min-width:0}
.facts dt{font-size:var(--t-lab);color:var(--faint);flex:none;width:64px}
.facts dd{margin:0;font-size:var(--t-detail);font-weight:500;overflow-wrap:anywhere;min-width:0}

/* ---------- dialog sheets keep boxed fields ---------- */
dialog.sheet{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(560px,100%);max-height:92dvh;
  border-radius:14px;margin:auto}
dialog.sheet::backdrop{background:rgba(10,8,6,.45)}
@media (max-width:600px){dialog.sheet{margin:auto 0 0;max-width:100%;border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom)}}
.sheet-body{padding:18px;overflow:auto;max-height:92dvh}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-head h1{font-size:18px;font-stretch:112%}
.sheet-body h2{margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wide{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f>span{font-size:var(--t-lab);color:var(--faint)}
.sheet-body input,.sheet-body select,.sheet-body textarea{min-height:40px;padding:7px 10px;font-size:16px;
  background:var(--sheet);border:1px solid var(--line);border-radius:6px}
.sheet-body select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
  linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;
  background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.sheet-body textarea{min-height:64px}
.sheet-body input:focus,.sheet-body select:focus,.sheet-body textarea:focus{outline:none;border-color:var(--accent)}
.freezes{display:grid;gap:8px}
.freeze{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 38px;gap:6px;align-items:end}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
.setrow>div>div:first-child{font-size:13px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.seg button{all:unset;cursor:pointer;padding:6px 11px;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
details.more{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.more>summary{cursor:pointer;font-size:12.5px;color:var(--muted);list-style:none;padding:3px 0}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+ ";font-weight:600}
details.more[open]>summary::before{content:"\2212 "}
details.more>summary:hover{color:var(--ink)}
details.more .grid{margin-top:10px}
details.done>summary{cursor:pointer;color:var(--muted);font-size:13px;padding:10px 0}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:var(--ink);color:var(--sheet);
  padding:9px 14px;border-radius:3px;font-size:13px;z-index:20;max-width:90vw}
@media (min-width:900px){.toast{bottom:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===================================================================
   Log page redesign
   =================================================================== */
body[data-view="log"] .band{background:color-mix(in srgb,var(--sheet) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);color:var(--ink);padding-top:10px;padding-bottom:2px;border:0}
body[data-view="log"] .band .bandtitle{font-size:24px;font-weight:750;font-stretch:125%;letter-spacing:-.035em;color:var(--ink)}
body[data-view="log"] .band .banddate{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:5px 9px}
body[data-view="log"] .band .banddate input{color:var(--ink2);font-weight:600}
body[data-view="log"] .band .banddate input::-webkit-calendar-picker-indicator{filter:none;opacity:.55}
body[data-view="log"] .band .bandmini{color:var(--muted)}
body[data-view="log"] .top{background:color-mix(in srgb,var(--sheet) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom-color:transparent}
body[data-view="log"] #chrome.scrolled .band{border-bottom:1px solid var(--line)}
body[data-view="log"] #chrome.scrolled .top{border-bottom-color:var(--line)}

/* bag card */
.bagcard{position:relative;overflow:hidden;margin:6px 0 2px;padding:12px 14px 12px;color:#fff;background:#25306B;
  -webkit-clip-path:polygon(0 0,100% 0,100% calc(100% - 26px),calc(100% - 26px) 100%,0 100%);clip-path:polygon(0 0,100% 0,100% calc(100% - 26px),calc(100% - 26px) 100%,0 100%)}
.bagcard>*:not(.procwm){position:relative;z-index:1}
.bagcard .bagpick{margin:0}
.bagcard .sbag{color:#fff;font-size:19px;font-weight:750;font-stretch:112%;letter-spacing:-.025em}
.bagcard .sbag option{color:#14161F}
.bagcard .bagpick svg{stroke:#BFCBF5}
.bagcard .beanmeta{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;font-size:12.5px;color:#BFCBF5}
.bagcard .beanmeta .chip{background:rgba(255,255,255,.16);color:#fff;font-weight:600;border-radius:999px;padding:2px 8px}
.bagcard .beanmeta .chip.frozen{background:#6FA8FF;color:#101B3F}
.bagcard .beanmeta .thaw{color:#CFD9FF;text-decoration:underline}
.bagcard .beanline{margin-top:6px;font-size:12.5px;color:#BFCBF5}
.bagcard .beannotes{margin-top:7px;padding-left:9px;border-left:3px solid #F0A94A;font-size:13px;font-style:italic;color:#fff}
.procwm{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:88px;height:88px;pointer-events:none}
.procwm *{fill:none;stroke:rgba(255,255,255,.12);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.procwm .f{fill:rgba(255,255,255,calc(var(--lv,.12) * .45))}

/* section strips */
#brewForm .sect{margin:16px -16px 0;padding:6px 16px;border-top:1px solid;border-bottom:1px solid;position:relative;overflow:hidden}
#brewForm .sect.slim{padding:5px 16px;font-size:12px}
#brewForm .sect::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(90deg,color-mix(in srgb,currentColor 22%,transparent),transparent 65%)}
#brewForm .sect>span{position:relative;z-index:1}
#brewForm .sect{background:#C8D6FF;border-color:#93ACF7;color:#132BB4}
#brewForm .sect.slim{background:#CCD7EA;border-color:#9FB2CE;color:#254272}
#brewForm .sect.under{background:#F6D9A8;border-color:#D4A254;color:#6F3F05}

/* boards */
.board{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin:10px 0 14px}
.bc{position:relative;background:var(--surface);padding:6px 10px 5px;min-width:0;transition:box-shadow .12s}
.bc.wide{grid-column:1/-1}
.bc:focus-within{box-shadow:inset 0 0 0 1.5px var(--accent)}
.board .val{border-bottom:0;min-height:33px;padding-bottom:0}
.board .num.sub .val{min-height:30px}
.board .bc.bloom{background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}
.board .ratio{top:auto;bottom:8px;left:8px;right:auto;font-size:12px}
.board .txt{border-bottom:0;min-height:30px;padding-bottom:0}
.board .txt>span{width:auto;min-width:48px}
.recipe4{grid-template-columns:repeat(4,minmax(0,1fr))}
.recipe4 .bc{padding:6px 8px}
.recipe4 .nlab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.recipe4 .val{flex-wrap:wrap;min-height:0;row-gap:4px}
.recipe4 .val input{font-size:21px;width:3.4ch;min-width:0;flex:none;letter-spacing:-.02em}
.recipe4 .num.sub .val input{font-size:19px}
.recipe4 .val i{margin-left:-2px}
.recipe4 .nudge{margin-left:0;flex-basis:100%;gap:3px}
.recipe4 .nudge button{width:24px;height:22px;font-size:13px}
.recipe4 .bc.wide .txt>span{width:auto;min-width:56px}
.gearboard{margin:8px 0 12px}
.gearboard .bc{padding:4px 9px}
.gearboard .txt{flex-direction:row;align-items:baseline;gap:6px;min-height:26px}
.gearboard .txt>span{font-size:11px;flex:none;align-self:auto;padding:0}
.gearboard .txt input{font-size:13.5px;align-self:auto;padding:0}

/* empty vs filled cells */
.bc.isempty{background:#E9EFFF}
.bc.isempty .nlab{color:#2540C8}
.bc.isempty.bloom{background:#DDE6FF}
.bc.isempty .nudge button{background:var(--surface);color:#2540C8}

/* brew along */
.along{display:block!important;padding:0!important;background:#EDF2FF!important}
.along summary{list-style:none;display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer}
.along summary::-webkit-details-marker{display:none}
.along .tw{display:grid;place-items:center;width:16px;height:16px;flex:none;transition:transform .18s}
.along .tw svg{width:14px;height:14px;fill:none;stroke:#1B34D8;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.along[open] .tw{transform:rotate(90deg)}
.along .alab{font-size:12.5px;font-weight:700;letter-spacing:.03em;color:#1B34D8}
.alongbody{padding:2px 12px 10px}
.alongtop{display:flex;gap:8px;align-items:center}
.alongtop select{flex:1;font-size:13.5px;font-weight:600;padding:5px 6px;border:1px solid #BCCAFB;border-radius:3px;background:var(--surface);color:var(--ink);cursor:pointer;width:auto}
.alongtop button{flex:none;border:1px solid var(--accent);background:none;color:var(--accent);font-size:12.5px;font-weight:650;padding:5px 9px;border-radius:3px;cursor:pointer}
.scaleline{display:flex;align-items:baseline;gap:8px;margin-top:7px;font-size:12px;color:var(--muted);min-height:16px}
.scaleline b{color:var(--accent);font-weight:700}
.scaleline button{border:0;background:none;padding:0;margin-left:auto;color:var(--accent);font-size:12px;font-weight:650;cursor:pointer;flex:none}
.circlewrap{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:center;padding:8px 2px}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--accent);stroke-dasharray:327;stroke-dashoffset:327;transition:stroke-dashoffset .3s linear,stroke .45s ease}
.ringmid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.ringmid b{font-size:13px;font-weight:700;transition:color .45s ease}
.ringmid span{font-size:22px;font-weight:750;font-stretch:118%;letter-spacing:-.03em;line-height:1;transition:color .45s ease}
.ringmid em{font-style:normal;font-size:11px;color:var(--muted)}
.dots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.dots li{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.dots li .pip{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none;transition:background .3s ease}
.dots li b{font-weight:700;color:var(--ink2);width:34px}
.dots li .what{flex:1}
.dots li .tgt{font-weight:700;color:var(--ink)}
.alongempty{font-size:12.5px;color:var(--muted);padding:10px 2px}
.timerow{display:flex;align-items:center;gap:8px;margin-top:6px}
.tbtn{border:0;border-radius:3px;background:var(--accent);color:#fff;font-size:13px;font-weight:650;padding:7px 14px;cursor:pointer}
.tbtn.ghost{background:var(--surface);color:var(--ink2);border:1px solid #BCCAFB}
.tbtn.on{background:#E8912A;color:#231403}
.clock{margin-left:auto;font-size:22px;font-weight:700;font-stretch:118%;letter-spacing:-.03em}

/* taste board */
.tasteboard{grid-template-columns:132px minmax(0,1fr)}
.tasteboard .ratelabel{display:flex;align-items:baseline;justify-content:space-between}
.tasteboard .rate{margin-top:4px}
.tcomp{padding:8px}
.tcomp .compass{width:100%}
.tcomp .ax{font-size:10px;padding:0 2px}
.tcomp .tapme{font-size:11px}
.tcomp .tastesaid{margin-top:5px;font-size:12.5px;line-height:1.3}
.tnotes{display:flex;flex-direction:column;cursor:text}
.tnotes .snotes{flex:1;border-bottom:0;min-height:96px;resize:none;padding-top:2px}
.tnotes:focus-within{box-shadow:inset 0 0 0 1.5px var(--accent)}

/* dark */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sheet:#0A0D17;
}}
:root[data-theme="dark"]{--sheet:#0A0D17}
:root[data-theme="dark"] .bagcard,html:not([data-theme="light"]) .bagcard{background:#111931;box-shadow:inset 0 0 0 1px rgba(111,140,255,.28)}
:root[data-theme="dark"] .board,html:not([data-theme="light"]) .board{background:rgba(111,140,255,.16);border-color:rgba(111,140,255,.16)}

:root[data-theme="dark"] .bc.isempty,html:not([data-theme="light"]) .bc.isempty{background:#111A38}
:root[data-theme="dark"] .bc.isempty .nlab,html:not([data-theme="light"]) .bc.isempty .nlab{color:#9BB2FF}
:root[data-theme="dark"] .board .bc.bloom,html:not([data-theme="light"]) .board .bc.bloom{background:#16224A}
:root[data-theme="dark"] .bc.isempty.bloom,html:not([data-theme="light"]) .bc.isempty.bloom{background:#1A2550}
:root[data-theme="dark"] #brewForm .sect,html:not([data-theme="light"]) #brewForm .sect{background:#1B2A66;border-color:#3A55B8;color:#C3D1FF}
:root[data-theme="dark"] #brewForm .sect.slim,html:not([data-theme="light"]) #brewForm .sect.slim{background:#1A2436;border-color:#35496E;color:#B6C6E6}
:root[data-theme="dark"] #brewForm .sect.under,html:not([data-theme="light"]) #brewForm .sect.under{background:#3D2C10;border-color:#8A6524;color:#F8CE8A}
:root[data-theme="dark"] .along,html:not([data-theme="light"]) .along{background:#111A33!important}
:root[data-theme="dark"] .along .alab,html:not([data-theme="light"]) .along .alab{color:#9FB4FF}
:root[data-theme="dark"] .along .tw svg,html:not([data-theme="light"]) .along .tw svg{stroke:#9FB4FF}
:root[data-theme="dark"] .alongtop select,html:not([data-theme="light"]) .alongtop select{background:#0D1120;border-color:rgba(111,140,255,.3)}
:root[data-theme="dark"] .tbtn.ghost,html:not([data-theme="light"]) .tbtn.ghost{background:#0D1120;border-color:rgba(111,140,255,.3)}
:root[data-theme="dark"] body[data-view="log"] .top,html:not([data-theme="light"]) body[data-view="log"] .top{background:var(--sheet)}
body[data-view="log"] .saverow .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] body[data-view="log"] .saverow .btn.primary,html:not([data-theme="light"]) body[data-view="log"] .saverow .btn.primary{color:#0A0D17}
.recipe4 .val input[data-k="grind"]{width:100%;font-size:17px;letter-spacing:0}
.recipe4 .val input.txtval{font-size:13px;font-weight:600;line-height:1.2}
body[data-view="log"] .saverow{margin-top:10px}
/* ===================================================================
   Shared theme: History, Insights, Recipes, Bags
   =================================================================== */
.band{background:color-mix(in srgb,var(--sheet) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);color:var(--ink);border:0;padding-top:10px}
.band .bandtitle{color:var(--ink);font-size:24px;font-weight:750;font-stretch:125%;letter-spacing:-.035em}
.band .bandright,.band .bandmini{color:var(--muted)}
.band .bandbtn{color:var(--accent);font-weight:650}
.top{background:color-mix(in srgb,var(--sheet) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom-color:transparent}
#chrome.scrolled .band{border-bottom:1px solid var(--line)}

/* shared: boards and wash headers on every tab */
.sect,.selline,.fh{position:relative;overflow:hidden;margin:16px -16px 10px;padding:6px 16px;background:#C8D6FF;border-top:1px solid #93ACF7;border-bottom:1px solid #93ACF7;color:#132BB4;font-size:13px;font-weight:650;letter-spacing:.03em}
.sect::after,.selline::after,.fh::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(90deg,color-mix(in srgb,currentColor 22%,transparent),transparent 65%)}
.selline>*{position:relative;z-index:1}

/* History: brews as a board of rows */
.hbody{border:1px solid var(--line);border-radius:3px;background:var(--surface);overflow:hidden}
.hrow{border-top:1px solid var(--line);padding:9px 12px;background:var(--surface)}
.hrow:first-child{border-top:0}
.hrow .num,.hrow>b:first-child{color:var(--accent)}
.hdate{color:var(--muted);font-size:12px}
.selline{display:flex;align-items:center;gap:8px}

/* Insights: metrics and factors as boards */
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.metrics .stat{background:var(--surface);padding:7px 10px;margin:0}
.factor{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:9px 12px;margin-bottom:6px}
.factor .bar{background:var(--hair)}
.factor .bar>span,.factor .bar i{background:var(--accent)}

/* Recipes: card as a board, specs as cells */
.item{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:10px 12px;margin-bottom:8px}
.rxspecs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin:8px -2px}

// Dates are stored as local "YYYY-MM-DD" strings.

const live = (r) => r && !r.deleted;
const allBags = () => Object.values(S.records).filter((r) => r.type === "bag" && live(r));
const activeBags = () => allBags().filter((b) => !b.finished).sort(byRoastDesc);
const byRoastDesc = (a, b) => (b.roastDate || "").localeCompare(a.roastDate || "") || (b.createdAt || 0) - (a.createdAt || 0);
const brews = () => Object.values(S.records).filter((r) => r.type === "brew" && live(r))
  .sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || 0) - (a.createdAt || 0));
const settings = () => ({ tempUnit: "F", finerIsLower: true, ...(S.records.settings || {}) });

// =====================================================================
// Coffee math
// =====================================================================
function daysOff(bag, dateStr) {
  const r = dayNum(bag?.roastDate), t = dayNum(dateStr || today());
  if (isNaN(r) || isNaN(t)) return null;
  let frozen = 0;
  for (const f of bag.freezes || []) {
    const s = Math.max(dayNum(f.start), r);
    const e = Math.min(f.end ? dayNum(f.end) : t, t);
    if (!isNaN(s) && !isNaN(e) && e > s) frozen += e - s;

const isFrozen = (bag) => { const f = (bag.freezes || []).at(-1); return !!(f && f.start && !f.end); };
const ratio = (b) => (b.dose > 0 && b.waterG > 0 ? b.waterG / b.dose : null);
const ratioStr = (r) => (r ? "1:" + round(r, 1) : "");
const numGrind = (g) => (/^\s*-?\d+(\.\d+)?\s*$/.test(String(g ?? "")) ? Number(g) : null);

function originLine(g) {

// =====================================================================
// Advice engine
// =====================================================================
// The lead tip shows its change as numerals, so the target is returned, not baked into prose.
function grindTarget(b, dir, big) {

function advise(b) {

      out.also = tips.slice(1, 4);
    } else if (isNum(b.rating) && b.rating >= 8) {
      out.lead = { text: "Dialed in. Keep this recipe.", why: "To explore from here, change one thing at a time so you know what made the difference." };
    } else if (isNum(b.rating) && b.rating <= 5) {
      out.lead = { text: "The balance is right, so look past the recipe.", why: "A balanced but dull cup usually comes down to the beans or the water." };
    } else {
      out.lead = { text: "Close. Make one small change and compare.", why: "Try a slightly finer grind to see if it gets sweeter. If it turns bitter, go back." };
    }
    if (ext === "over" && str === "weak") out.notes.push("Bitter and weak together often means channeling: water finding a fast path through the bed. Pour gently and keep the bed flat.");
  }

  if (d) {
    if (d.adjusted < 5) out.notes.push(`These beans are only ${d.adjusted} day${d.adjusted === 1 ? "" : "s"} off roast. Very fresh coffee is still releasing gas, which can taste sharp or muted. A longer bloom (45–60 s) helps.`);
    else if (d.adjusted > 35) out.notes.push(`These beans are ${d.adjusted} days off roast${d.frozen ? " (not counting time frozen)" : ""}. Flavor fades after about 4–5 weeks, so they may taste flat whatever the recipe.`);
  }
  if (/distill/i.test(b.waterType || "") && !/mineral/i.test(b.waterType || "")) out.notes.push("Plain distilled water has none of the minerals that pull flavor out of coffee. Add minerals or use filtered water.");

  const others = brews().filter((x) => x.bagId === b.bagId && x.id !== b.id && isNum(x.rating));
  if (others.length) {
    const best = others.reduce((a, x) => (x.rating > a.rating || (x.rating === a.rating && x.date > a.date) ? x : a));
    if (!isNum(b.rating) || best.rating > b.rating) out.best = best;
  }
  return out;
}

let syncTimer = null, syncing = false, syncAgain = false, healTries = 0;
function scheduleSync(ms = 1200) { clearTimeout(syncTimer); syncTimer = setTimeout(sync, ms); }
// Google Sign-In. The ID token goes to /api/session once; after that the
// session cookie does the work, so this sheet only appears when signed out.
let gisReady = null;
function loadGIS() {
  return (gisReady ||= new Promise((res, rej) => {
    const el = document.createElement("script");
    el.src = "https://accounts.google.com/gsi/client";
    el.async = true;
    el.onload = res;
    el.onerror = () => rej(new Error("Couldn't reach Google. Check your connection or any content blocker."));
    document.head.appendChild(el);
  }));
}
function openSignIn() {
  openSheet(`
    <div class="sheet-head"><h1>Sign in</h1><button class="iconbtn" data-close type="button" aria-label="Close">\u2715</button></div>

    <p class="muted small" id="gerr" role="alert"></p>

    try {

      if (!cfg.clientId) return fail("Sign-in isn't set up on the server yet.");
      await loadGIS();

        callback: async (resp) => {

              method: "POST", headers: { "content-type": "application/json" },
              body: JSON.stringify({ credential: resp.credential }), credentials: "same-origin",
            });
            if (!r.ok) return fail(((await r.json().catch(() => ({}))).error) || "That didn't work. Try again.");
            closeSheet();
            S.verified = false; // makes the next sync adopt the account and merge local brews
            healTries = 0;
            sync();
          } catch { fail("Couldn't reach the server. Try again."); }
        },
      });
      // Google's "outline" button is white on a light border, which vanishes on the dark sheet.
      const dark = document.documentElement.dataset.theme === "dark";
      google.accounts.id.renderButton($("#gbtn", root), {
        theme: dark ? "filled_blue" : "outline", size: "large", text: "signin_with", shape: "rectangular",
      });

async function signOut() {

function setStatus(s) {
  S.status = s;
  const el = $("#status");
  el.dataset.s = s;
  const label = {
    idle: "Loading", saving: "Saving", synced: "Synced", offline: "Offline, saved on this device",
    signin: "Sign in to sync", error: "Sync error", local: LS.ok ? "Saved on this device only" : "Preview, not saved",
  }[s] || s;
  el.setAttribute("aria-label", label);
  el.title = label;
  // A coloured dot for the quiet states; a real icon when it wants attention.
  const svg = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
  el.innerHTML = {
    signin: svg('<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l-5-5 5-5"/><path d="M15 12H5"/>'),
    offline: svg('<path d="M3 3l18 18"/><path d="M8.5 8.5A5 5 0 0 0 7 18h9a4 4 0 0 0 1.5-7.7"/><path d="M12 7a5 5 0 0 1 5 4"/>'),
    error: svg('<circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><path d="M12 16h.01"/>'),
  }[s] || "<i></i>";
}

async function sync() {
  if (syncing) { syncAgain = true; return; }
  syncing = true;
  if (S.pending.size) setStatus("saving");
  const sent = {};
  const changes = [];
  if (S.verified) {
    for (const id of [...S.pending].slice(0, 500)) {
      const r = S.records[id];
      if (r) { changes.push(r); sent[id] = r.updatedAt; } else S.pending.delete(id);
    }
  }
  try {
    const res = await fetch("/api/sync", {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ changes }),
      redirect: "manual", credentials: "same-origin", cache: "no-store",
    });
    if (res.type === "opaqueredirect" || res.status === 401 || res.status === 403) { setStatus("signin"); return; }
    if (res.status === 404 || res.status === 405 || !(res.headers.get("content-type") || "").includes("json")) { setStatus("local"); return; } // no sync server here (preview or plain file host)
    if (!res.ok) {
      let msg = ""; try { msg = (await res.json()).error; } catch {}
      setStatus("error"); if (msg) console.warn("Sync:", msg); return;
    }
    const data = await res.json();

    if (!S.verified || data.email !== S.email) {
      const wasLocal = !S.email;
      const prev = { records: S.records };
      if (data.email !== S.email) loadStore(data.email);
      LS.set("brewlog:lastEmail", data.email);
      if (wasLocal) {
        for (const [id, r] of Object.entries(prev.records)) {
          const cur = S.records[id];
          if (!cur || r.updatedAt > cur.updatedAt) { S.records[id] = r; S.pending.add(id); }
        }
        LS.remove(storeKey(null));
      }
      S.verified = true;
      syncAgain = true;
    }

    const server = {};
    let changed = false;
    for (const r of data.records || []) {
      server[r.id] = r;
      const cur = S.records[r.id];
      if (!cur || r.updatedAt > cur.updatedAt) { S.records[r.id] = r; changed = true; }
    }
    for (const id of Object.keys(sent)) if (server[id] && server[id].updatedAt >= S.records[id].updatedAt) S.pending.delete(id);
    for (const id of data.rejected || []) S.pending.delete(id);
    // Self-heal: anything this device has that the server lacks gets re-sent.
    const missing = Object.keys(S.records).filter((id) => !server[id] && !S.pending.has(id));
    if (missing.length && healTries < 3) { healTries++; missing.forEach((id) => S.pending.add(id)); }

    persist();
    setStatus(S.pending.size ? "saving" : "synced");
    if (changed) softRender();
    if (S.pending.size) syncAgain = true;
  } catch (e) {
    setStatus(!LS.ok || !/^https?:$/.test(location.protocol) ? "local" : "offline");
  } finally {
    syncing = false;
    if (syncAgain && S.status !== "offline" && S.status !== "error") { syncAgain = false; scheduleSync(400); }
    else syncAgain = false;
  }
}

    if (typeof paintBagExtras === "function") paintBagExtras();
    if (typeof paintRoasterLine === "function") paintRoasterLine();
  };
  updRoast();
  initLogExtras();

  form.addEventListener("input", (e) => {
    if (e.target.dataset.r !== undefined) FORM.dirty = true;
    if (["dose", "waterG"].includes(e.target.dataset.k)) updRatio();
    updMini();
  });
  field("date").addEventListener("input", () => { updRoast(); updMini(); });
  // Without a box to aim at, tapping anywhere in a value cell should land in its field.
  form.addEventListener("pointerdown", (e) => {
    const cell = e.target.closest(".val");
    if (!cell || e.target.closest("button") || e.target.tagName === "INPUT") return;
    const inp = cell.querySelector("input");
    if (inp) { e.preventDefault(); inp.focus(); }
  });
  const timeIn = field("time");
  timeIn.addEventListener("input", () => {
    const masked = maskTime(timeIn.value);
    if (masked === timeIn.value) return;
    timeIn.value = masked;
    try { timeIn.setSelectionRange(masked.length, masked.length); } catch {} // caret stays at the end
  });
  timeIn.addEventListener("blur", () => { timeIn.value = normTime(timeIn.value); });

  field("bagId").addEventListener("change", (e) => {
    if (e.target.value === "__new") {
      const prevBag = FORM.d.bagId;
      e.target.value = prevBag;
      openBagSheet(null, (bag) => { field("bagId").innerHTML = bagOptions(bag.id); FORM.d.bagId = bag.id; updRoast(); });
      return;
    }
    FORM.d.bagId = e.target.value;
    if (!FORM.editing && !FORM.dirty) {
      const nd = draftFrom(null, e.target.value);
      ["grinder", "grind", "waterType", "brewer", "filter", "dose", "waterG", "bloomG", "bloomS", "method", "pours"].forEach((k) => (field(k).value = nd[k] ?? ""));
      field("temp").value = tempDisp(nd.tempF) ?? "";
      updRatio();
    }
    updRoast();
    updMini();
  });

  $$("[data-step]", form).forEach((btn) => btn.addEventListener("click", () => {
    const k = btn.dataset.step, dir = Number(btn.dataset.dir);
    const inp = field(k);
    const cur = num(inp.value);
    if (k === "grind" && cur == null && inp.value.trim()) return;
    const step = k === "temp" ? (settings().tempUnit === "C" ? 0.5 : 1) : (cur != null && !Number.isInteger(cur) ? 0.1 : 1);
    const base = cur ?? (k === "temp" ? (settings().tempUnit === "C" ? 94 : 200) : 0);
    let next = round(base + dir * step, step < 1 ? 1 : 0);
    if (k === "pours" && next < 0) next = 0;
    inp.value = next;
    FORM.dirty = true;
    updMini();
  }));

  // rating
  $("#rate").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const r = Number(b.dataset.r);
    FORM.d.rating = FORM.d.rating === r ? null : r;
    $$("#rate button").forEach((x) => x.setAttribute("aria-pressed", String(Number(x.dataset.r) === FORM.d.rating)));
    const rv = $("#rateVal");
    rv.innerHTML = isNum(FORM.d.rating) ? String(FORM.d.rating) : "&ndash;";
    rv.classList.toggle("off", !isNum(FORM.d.rating));
  });

  bindCompass();

  $("#saveBrew").addEventListener("click", () => {
    const bagId = field("bagId").value;
    if (!S.records[bagId]) { toast("Pick a bag first."); return; }
    const tIn = num(field("temp").value);
    const rec = {
      ...(editing || {}),
      id: editing ? editing.id : uid(), type: "brew", createdAt: editing?.createdAt || Date.now(),
      date: field("date").value || today(), bagId,
      grinder: field("grinder").value.trim(), grind: field("grind").value.trim(),
      tempF: tIn == null ? null : round(settings().tempUnit === "C" ? cToF(tIn) : tIn, 1),
      waterType: field("waterType").value.trim(), brewer: field("brewer").value.trim(),
      dose: num(field("dose").value), waterG: num(field("waterG").value),
      bloomG: num(field("bloomG").value), bloomS: num(field("bloomS").value),
      pours: num(field("pours").value), timeS: parseTime(normTime(field("time").value)),
      filter: field("filter").value.trim(), method: field("method").value.trim(), rating: FORM.d.rating, taste: FORM.d.taste,
      notes: field("notes").value.trim(),
    };
    put(rec);
    FORM = null;
    go("brew/" + rec.id);
  });
}

const HONEY_LEVEL = { white:.08, yellow:.16, red:.26, black:.38 };
function matchProcess(text) {
  const t = String(text || "").toLowerCase();
  const has = (...w) => w.some((x) => t.includes(x));
  let key = "experimental";
  if (!t.trim()) key = "washed";
  else if (has("decaf", "swiss water", "sugarcane", "mountain water")) key = "decaf";
  else if (has("carbonic")) key = "carbonic";
  else if (has("thermal")) key = "thermal";
  else if (has("double anaerobic", "double ferment")) key = "double";
  else if (has("koji", "aspergillus")) key = "koji";
  else if (has("lactic", "lacto")) key = "lactic";
  else if (has("yeast", "inocul", "culture")) key = "yeast";
  else if (has("co-ferment", "coferment", "infus", "fruit")) key = "cofermented";
  else if (has("barrel", "whiskey", "whisky", "rum", "wine")) key = "barrel";
  else if (has("extended", "long ferment", "slow ferment", "72", "96")) key = "extended";
  else if (has("monsoon", "malabar")) key = "monsooned";
  else if (has("wet-hull", "wet hull", "giling")) key = "wethulled";
  else if (has("anaerobic", "anoxic")) key = "anaerobic";
  else if (has("pulped", "semi-wash", "semi wash")) key = "pulped";
  else if (has("honey")) key = "honey";
  else if (has("natural", "dry", "sun-dried", "sun dried")) key = "natural";
  else if (has("washed", "wet")) key = "washed";
  const lv = key === "honey" ? Object.keys(HONEY_LEVEL).find((k) => t.includes(k)) : null;
  return { key, level: lv ? HONEY_LEVEL[lv] : null };
}

/* recipes for the brewer in gear, scaled by the dose above */
function alongRecipes() {
  const brewer = ($('[data-k="brewer"]')?.value || "").trim();
  const key = RECIPE_BREWERS.find((b) => normKey(b) === normKey(brewer));
  const list = [];
  myRecipes().forEach((r) => { if (AL.showAll || !brewer || normKey(r.brewer || "") === normKey(brewer)) list.push({ ...r, mine: true }); });
  (AL.showAll || !key ? RECIPE_BREWERS : [key]).forEach((b) => RECIPES[b].forEach((r) => list.push({ ...r, brewer: b })));
  return { list, key: key || (brewer && list.some((r) => r.mine) ? brewer : null), brewer };
}
function alongOptions() {
  const sel = $("#recipePick"); if (!sel) return;
  const { list, key } = alongRecipes();
  const cur = AL.recipe ? list.findIndex((r) => r.name === AL.recipe.name && r.brewer === AL.recipe.brewer) : -1;
  sel.innerHTML = `<option value="">Pick a recipe</option>`
    + list.map((r, i) => `<option value="${i}">${esc(r.name)}${r.mine ? " (yours)" : ""}${(AL.showAll || !key) ? ` \u2013 ${esc(r.brewer)}` : ""}</option>`).join("")
    + (key && !AL.showAll ? `<option value="all">Show all brewers</option>` : "")
    + (AL.showAll && key ? `<option value="mine">Only ${esc(key)}</option>` : "");
  sel.value = cur >= 0 ? String(cur) : "";
}
function alongScaled() {
  const r = AL.recipe; if (!r) return null;
  const dose = num($('[data-k="dose"]').value) || r.dose;
  const k = dose / r.dose;
  let prev = 0;
  const steps = r.pours.map(([t, g, lab]) => {
    const cum = g == null ? null : Math.round(g * k);
    const add = cum == null ? null : cum - prev;
    if (cum != null) prev = cum;
    return { t, cum, add, lab };
  });
  // The written pours are the source of truth; fall back to the ratio only when a recipe has none.
  const lastCum = [...steps].reverse().find((x) => x.cum != null)?.cum;
  const water = lastCum ?? Math.round(dose * r.ratio);
  steps.push({ t: r.totalS, cum: null, add: null, lab: "drawdown" });
  return { dose, water, steps };
}
function renderAlong() {
  const box = $("#steps"); if (!box) return;
  const sc = alongScaled();
  if (!sc) {
    box.innerHTML = `<div class="alongempty">Pick a recipe to pour along with it.</div>`;
    $("#scaleTxt").textContent = ""; $("#resetScale").hidden = true;
    return;
  }
  box.innerHTML = `<div class="circlewrap">
    <div class="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="ringFg" cx="60" cy="60" r="52"/></svg>
      <div class="ringmid"><b id="ringName"></b><span id="ringTgt"></span><em id="ringAt"></em></div></div>
    <ol class="dots">${sc.steps.map((st, i) => `<li data-i="${i}"><span class="pip"></span><b>${mmss(st.t)}</b>
      <span class="what">${esc(st.lab || (i === 0 ? "bloom" : "pour " + (i + 1)))}</span>
      <span class="tgt">${st.cum != null ? st.cum + " g" : ""}</span></li>`).join("")}</ol></div>`;
  const off = Math.abs(sc.dose - AL.recipe.dose) > 0.05;
  $("#scaleTxt").innerHTML = off
    ? `Scaled from ${round(AL.recipe.dose, 1)} g to <b>${round(sc.dose, 1)} g</b>, so ${sc.water} g water at 1:${round(sc.water / sc.dose, 1)}`
    : `${round(AL.recipe.dose, 1)} g and ${sc.water} g water at 1:${round(AL.recipe.ratio, 1)}. Change coffee above to rescale.`;
  $("#resetScale").hidden = !off;
  paintAlong();
}
function paintAlong() {
  const sc = alongScaled(); if (!sc || !$("#ringFg")) return;
  const running = AL.tick != null, last = sc.steps[sc.steps.length - 1].t || 1;
  let cur = 0;
  sc.steps.forEach((st, i) => { if (running && AL.elapsed >= st.t) cur = i; });
  const n = sc.steps.length;
  $$("#steps .dots li").forEach((li, i) => {
    li.classList.toggle("now", running && i === cur);
    if (running && i < cur) li.classList.add("done");
    const c = stepColor(i, n);
    li.querySelector(".pip").style.background = (running && i <= cur) ? c : "";
    li.style.color = (running && i === cur) ? c : "";
    li.querySelector("b").style.color = (running && i === cur) ? c : "";
  });
  const pct = Math.min(100, (AL.elapsed / (last + 40)) * 100), C = 2 * Math.PI * 52, col = stepColor(running ? cur : 0, n);
  const fg = $("#ringFg");
  fg.style.strokeDashoffset = C * (1 - pct / 100); fg.style.stroke = col;
  const st = sc.steps[running ? cur : 0];
  $("#ringName").textContent = st.lab || (running && cur > 0 ? "pour " + (cur + 1) : "bloom");
  $("#ringName").style.color = col;
  $("#ringTgt").textContent = st.cum != null ? `${st.cum} g` : "";
  $("#ringTgt").style.color = col;
  $("#ringAt").textContent = `at ${mmss(st.t)}`;
}
function alongStop() { clearInterval(AL.tick); AL.tick = null; const b = $("#tStart"); if (b) { b.textContent = "Start"; b.classList.remove("on"); } }

function initLogExtras() {
  AL = { recipe: null, t0: null, tick: null, elapsed: 0, showAll: false };
  paintProcess();
  paintBagExtras();
  markAllEmpty();
  styleGrind();
  const form = $("#brewForm");
  form.addEventListener("input", (e) => {
    if (e.target.matches("input,textarea")) markEmpty(e.target);
    if (e.target.dataset.k === "grind") styleGrind();
    if (e.target.dataset.k === "dose") renderAlong();
    if (e.target.dataset.k === "brewer") { AL.showAll = false; alongOptions(); }
  });
  form.addEventListener("click", (e) => { if (e.target.closest("[data-step]")) setTimeout(markAllEmpty, 0); });
  $("#bagSel").addEventListener("change", () => { paintProcess(); paintBagExtras(); });

  const along = $("#along");
  along.open = LS.get("brewlog:alongOpen") === "1";
  along.addEventListener("toggle", () => LS.set("brewlog:alongOpen", along.open ? "1" : "0"));

  alongOptions();
  renderAlong();

  $("#recipePick").addEventListener("change", (e) => {
    const v = e.target.value;
    if (v === "all") { AL.showAll = true; alongOptions(); return; }
    if (v === "mine") { AL.showAll = false; alongOptions(); return; }
    const { list } = alongRecipes();
    AL.recipe = v === "" ? null : list[+v];
    if (AL.recipe) {
      const bf = $('[data-k="brewer"]');
      if (normKey(bf.value || "") !== normKey(AL.recipe.brewer)) { bf.value = AL.recipe.brewer; markEmpty(bf); FORM.dirty = true; }
    }
    alongOptions(); renderAlong();
  });
  $("#fillFrom").addEventListener("click", () => {
    const sc = alongScaled(); if (!sc) return;
    const r = AL.recipe, unit = settings().tempUnit;
    const set = (k, val) => { const f = $(`[data-k="${k}"]`); if (f && val != null && val !== "") { f.value = val; markEmpty(f); } };
    set("dose", round(sc.dose, 1)); set("waterG", sc.water);
    set("grind", r.grind); styleGrind(); set("temp", unit === "C" ? round(fToC(r.tempF), 1) : r.tempF);
    const bloom = sc.steps[0], second = sc.steps[1];
    const firstLab = String(bloom?.lab || "").toLowerCase();
    const noBloom = /no bloom|skip bloom/.test(firstLab);
    const smallFirst = bloom?.cum != null && second?.cum != null && bloom.cum < sc.water * 0.5;
    const hasBloom = !noBloom && bloom?.cum != null && second?.cum != null && (firstLab.includes("bloom") || (!r.immersion && smallFirst));
    const clear = (k) => { const f = $(`[data-k="${k}"]`); if (f) { f.value = ""; markEmpty(f); } };
    if (hasBloom) { set("bloomG", bloom.cum); set("bloomS", second.t); } else { clear("bloomG"); clear("bloomS"); }
    set("pours", sc.steps.filter((x) => x.cum != null).length);
    set("method", r.by && r.by !== "yours" ? `${r.name} (${r.by})` : r.name);
    FORM.dirty = true;
    $('[data-k="dose"]').dispatchEvent(new Event("input", { bubbles: true }));
    renderAlong();
  });
  $("#resetScale").addEventListener("click", () => {
    const f = $('[data-k="dose"]'); f.value = round(AL.recipe.dose, 1); markEmpty(f); FORM.dirty = true;
    f.dispatchEvent(new Event("input", { bubbles: true })); renderAlong();
  });
  $("#tStart").addEventListener("click", () => {
    if (AL.tick) {
      alongStop();
      const t = $('[data-k="time"]');
      if (t) { t.value = mmss(Math.round(AL.elapsed)); markEmpty(t); FORM.dirty = true; t.dispatchEvent(new Event("input", { bubbles: true })); }
      return;
    }
    AL.t0 = Date.now() - AL.elapsed * 1000;
    $("#tStart").textContent = "Stop"; $("#tStart").classList.add("on");
    AL.tick = setInterval(() => {
      AL.elapsed = (Date.now() - AL.t0) / 1000;
      $("#clock").textContent = mmss(Math.round(AL.elapsed));
      paintAlong();
    }, 250);
  });
  $("#tReset").addEventListener("click", () => {
    alongStop(); AL.elapsed = 0; $("#clock").textContent = "0:00";
    $$("#steps .dots li").forEach((li) => li.classList.remove("done", "now"));
    paintAlong();
  });
  window.addEventListener("hashchange", alongStop, { once: true });
}

function bindCompass() {
  const el = $("#compass"), dot = $("#dot"), label = $("#tasteLabel"), hint = $("#tapme");
  const show = () => {
    const t = FORM.d.taste;
    if (hint) hint.hidden = !!t;
    if (!t) { dot.hidden = true; label.textContent = "tap where this cup landed"; return; }
    dot.hidden = false;
    dot.style.left = ((t.x + 1) / 2) * 100 + "%";
    dot.style.top = ((1 - t.y) / 2) * 100 + "%";
    label.innerHTML = `${esc(tasteText(t))}<button type="button" id="clearTaste">clear</button>`;
    $("#clearTaste").onclick = () => { FORM.d.taste = null; show(); };
  };
  const set = (x, y) => { FORM.d.taste = { x: round(clamp(x, -1, 1) * 20) / 20, y: round(clamp(y, -1, 1) * 20) / 20 }; show(); };
  const place = (e) => { const r = el.getBoundingClientRect(); set(((e.clientX - r.left) / r.width) * 2 - 1, -(((e.clientY - r.top) / r.height) * 2 - 1)); };
  el.addEventListener("pointerdown", (e) => { el.setPointerCapture(e.pointerId); place(e); });
  el.addEventListener("pointermove", (e) => { if (el.hasPointerCapture(e.pointerId)) place(e); });
  el.addEventListener("keydown", (e) => {
    const m = { ArrowLeft: [-0.1, 0], ArrowRight: [0.1, 0], ArrowUp: [0, 0.1], ArrowDown: [0, -0.1] }[e.key];
    if (!m) return;
    e.preventDefault();
    const t = FORM.d.taste || { x: 0, y: 0 };
    set(t.x + m[0], t.y + m[1]);
  });
  show();
}

function bestRecipeFor(brewer) {
  const rated = brews().filter((b) => b.brewer && normKey(b.brewer) === normKey(brewer) && isNum(b.rating));
  if (rated.length < 3) return null;
  const top = rated.slice().sort((a, b) => b.rating - a.rating).slice(0, Math.max(3, Math.round(rated.length / 3)));
  const avg = (get) => { const xs = top.map(get).filter(isNum); return xs.length ? xs.reduce((a, c) => a + c, 0) / xs.length : null; };
  const grinds = top.map((b) => numGrind(b.grind)).filter(isNum);
  return {
    n: top.length, pool: rated.length,
    rating: avg((b) => b.rating), ratio: avg((b) => ratio(b)), tempF: avg((b) => b.tempF),
    timeS: avg((b) => b.timeS), dose: avg((b) => b.dose),
    grind: grinds.length ? round(grinds.reduce((a, c) => a + c, 0) / grinds.length, 1) : (top.find((b) => b.grind)?.grind ?? null),
  };
}

function viewRecipes() {
  const saved = LS.get("brewlog:recipeBrewer");
  const brewer = RECIPE_BREWERS.includes(saved) ? saved : RECIPE_BREWERS[0];
  const doseSaved = num(LS.get("brewlog:recipeDose"));
  const unit = settings().tempUnit;

  // "Medium-fine" doesn't fit a sixth of a phone, and the specs must stay on one line.
  const shortGrind = (g) => String(g ?? "").replace(/^medium-/i, "m-").replace(/^medium$/i, "medium");

  const mine = rxFor(brewer);
  const rxBrewers = [...new Set([...RECIPE_BREWERS, ...myRecipes().map((r) => r.brewer).filter(Boolean)])];
  const card = (r, key) => {
    const isMine = String(key).startsWith("my:");
    const dose = doseSaved || r.dose;
    const k = dose / r.dose;
    const water = Math.round(dose * r.ratio);
    let prev = 0, n = 0;
    const steps = r.pours.map(([t, g, lab]) => {
      if (g == null) {
        return `<div class="prow"><span class="pn none">&middot;</span><span class="pt">${mmss(t)}</span>
          <span class="pnote step">${esc(lab || "wait")}</span><span class="pg none">&mdash;</span></div>`;
      }
      const cum = Math.round(g * k), add = cum - prev;
      prev = cum; n++;
      const note = [add > 0 ? `+${add} g` : "", lab].filter(Boolean).join(" \u00b7 ");
      return `<div class="prow"><span class="pn">${n}</span><span class="pt">${mmss(t)}</span>
        <span class="pnote">${esc(note)}</span><span class="pg">${cum} g</span></div>`;
    }).join("");
    return `<article class="item">
      <span class="iname">${esc(r.name)}</span><span class="iby">${esc(r.by || "yours")}</span>
      <div class="rxspecs">
        <span><i>ratio</i>1:${round(r.ratio, 1)}</span>
        <span><i>dose</i>${round(dose, 1)} g</span>
        <span><i>water</i>${water} g</span>
        <span><i>temp</i>${esc(tempStr(r.tempF))}</span>
        <span><i>grind</i>${esc(shortGrind(r.grind))}</span>
        <span><i>total</i>${mmss(r.totalS)}</span>
      </div>
      <div class="pours">${steps}</div>
      <details class="more"><summary>how to pour it</summary><p class="beanline">${esc(r.notes)}</p></details>
      <div class="acts"><button class="linkbtn" type="button" data-rx="${key}">Brew this</button>${isMine ? `<button class="linkbtn" type="button" data-rxedit="${r.id}">Edit</button>` : ""}</div>
    </article>`;
  };

  const best = bestRecipeFor(brewer);
  const bestCard = !best
    ? `<article class="item plain"><span class="iname">Your best ${esc(brewer)}</span>
        <div class="beanline">Rate at least three ${esc(brewer)} brews and your own recipe shows up here.</div></article>`
    : `<article class="item mine">
        <span class="iname">Your best ${esc(brewer)}</span>
        <span class="iby">averaged from your ${best.n} highest-rated of ${best.pool} ${esc(brewer)} brew${best.pool === 1 ? "" : "s"}</span>
        <div class="rxspecs">
          ${best.ratio ? `<span><i>ratio</i>1:${round(best.ratio, 1)}</span>` : ""}
          ${best.dose ? `<span><i>dose</i>${round(best.dose, 1)} g</span>` : ""}
          ${best.grind != null ? `<span><i>grind</i>${esc(best.grind)}</span>` : ""}
          ${best.tempF ? `<span><i>temp</i>${esc(tempStr(best.tempF))}</span>` : ""}
          ${best.timeS ? `<span><i>time</i>${mmss(Math.round(best.timeS))}</span>` : ""}
          <span><i>rating</i>${round(best.rating, 1)}</span>
        </div>
        <div class="acts"><button class="linkbtn" type="button" data-rx="mine">Brew this</button></div>
      </article>`;

  setBand("Recipes", `<button class="bandbtn" type="button" id="newRx">New recipe</button>`, false);
  main.innerHTML = `
    <div class="srow selpair">
      <label class="selline"><span>brewer</span>
        <select id="rxBrewer" aria-label="Brewer">${rxBrewers.map((b) => `<option ${normKey(b) === normKey(brewer) ? "selected" : ""}>${esc(b)}</option>`).join("")}</select></label>
      <label class="selline"><span>scale to</span>
        <input id="rxDose" inputmode="decimal" value="${doseSaved ?? ""}" placeholder="dose g" aria-label="Scale recipes to this dose in grams"></label>
    </div>
    <div class="list">${bestCard}</div>
    ${mine.length ? `<div class="sect"><span>your recipes</span></div><div class="list">${mine.map((r, i) => card(r, "my:" + r.id)).join("")}</div>` : ""}
    <div class="sect"><span>classics</span></div>
    <div class="list">${(RECIPES[brewer] || []).map((r, i) => card(r, i)).join("")}</div>`;

  $("#rxBrewer").onchange = (e) => { LS.set("brewlog:recipeBrewer", e.target.value); viewRecipes(); };
  $("#newRx").onclick = () => openRecipeSheet(null, (r) => { if (r?.brewer) LS.set("brewlog:recipeBrewer", r.brewer); viewRecipes(); });
  main.addEventListener("click", (e) => {
    const b = e.target.closest("[data-rxedit]"); if (!b) return;
    openRecipeSheet(S.records[b.dataset.rxedit], (r) => { if (r?.brewer) LS.set("brewlog:recipeBrewer", r.brewer); viewRecipes(); });
  });
  const di = $("#rxDose");
  di.onchange = () => { const n = num(di.value); if (n && n > 0 && n < 200) LS.set("brewlog:recipeDose", String(round(n, 1))); else LS.remove("brewlog:recipeDose"); viewRecipes(); };

  main.onclick = (e) => {
    const btn = e.target.closest("[data-rx]"); if (!btn || ROUTE !== "recipes") return;
    if (!activeBags().length) { toast("Add a bag of beans first."); return; }
    if (String(btn.dataset.rx).startsWith("my:")) {
      const r = S.records[btn.dataset.rx.slice(3)];
      if (!r) return;
      const dose = doseSaved || r.dose, k = dose / r.dose;
      const wp = r.pours.filter((x) => isNum(x[1]));
      PREFILL = { brewer: r.brewer, dose: round(dose, 1), waterG: Math.round(dose * r.ratio), tempF: r.tempF,
        grind: r.grind || "", pours: wp.length, method: r.name };
      if (wp.length) { PREFILL.bloomG = Math.round(wp[0][1] * k); PREFILL.bloomS = wp[1] ? wp[1][0] : null; }
      go("log"); return;
    }
    if (btn.dataset.rx === "mine") {
      PREFILL = { brewer, dose: round(best.dose, 1), waterG: best.ratio && best.dose ? Math.round(best.dose * best.ratio) : null,
        tempF: best.tempF ? round(best.tempF, 1) : null, grind: best.grind == null ? "" : String(best.grind) };
    } else {
      const r = (RECIPES[brewer] || [])[Number(btn.dataset.rx)];
      if (!r) return;
      const dose = doseSaved || r.dose, k = dose / r.dose;
      const wp = r.pours.filter((x) => isNum(x[1]));
      PREFILL = { brewer, dose: round(dose, 1), waterG: Math.round(dose * r.ratio), tempF: r.tempF,
        pours: wp.length, method: `${r.name} (${r.by})` };
      if (!r.immersion && wp.length) { PREFILL.bloomG = Math.round(wp[0][1] * k); PREFILL.bloomS = wp[1] ? wp[1][0] : null; }
    }
    go("log");
  };
}

// The arrows walk the same list you came from, so the bag and month filters still hold.
let historyBag = "all";
let historyMonth = "all";   // "all" or "YYYY-MM"
let historyGrid = null;     // year shown in the open month grid, or null when closed
const monthOf = (d) => (d || "").slice(0, 7);
const monthName = (ym, style = "long") => { const [y, m] = ym.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString(undefined, style === "long" ? { month: "long", year: "numeric" } : { month: "short" }); };
function histBagList() { return historyBag === "all" ? brews() : brews().filter((x) => x.bagId === historyBag); }
function histMonths() { return [...new Set(histBagList().map((x) => monthOf(x.date)).filter(Boolean))]; } // newest first
function histList() { const l = histBagList(); return historyMonth === "all" ? l : l.filter((x) => monthOf(x.date) === historyMonth); }
const ARROW = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d === "l" ? "M15 6l-6 6 6 6" : "M9 6l6 6-6 6"}"/></svg>`;

function navPair(b) {
  const list = histList();
  const i = list.findIndex((x) => x.id === b.id);
  if (i === -1 || list.length < 2) return "";
  const newer = i > 0 ? list[i - 1] : null;   // brews() runs newest first
  const older = i < list.length - 1 ? list[i + 1] : null;
  const btn = (x, dir) => `<button type="button" class="bstep" ${x ? `data-go="brew/${x.id}"` : "disabled"} aria-label="${dir === "l" ? "Older brew" : "Newer brew"}">${ARROW(dir)}</button>`;
  return `<nav class="bnav" aria-label="Other brews">${btn(older, "l")}<span class="bpos">${i + 1} / ${list.length}</span>${btn(newer, "r")}</nav>`;
}

function viewHistory() {
  const all = brews();
  if (!all.length) {
    setBand("History", "", false);
    main.innerHTML = `<div class="empty"><h1>No brews yet</h1><p>Every cup you log shows up here, newest first.</p><button class="btn primary" type="button" data-go="log">Log a brew</button></div>`;
    return;
  }
  const bagsUsed = [...new Set(all.map((b) => b.bagId))].map((id) => S.records[id]).filter(Boolean);
  if (historyBag !== "all" && !bagsUsed.some((b) => b.id === historyBag)) historyBag = "all";
  const months = histMonths();
  if (historyMonth !== "all" && !months.includes(historyMonth)) historyMonth = "all";
  const list = histList();
  const mi = months.indexOf(historyMonth);
  const olderM = historyMonth === "all" ? months[0] : months[mi + 1];
  const newerM = historyMonth === "all" ? null : months[mi - 1];
  setBand("History", `<span class="bandnote">${list.length === all.length ? `${all.length} brew${all.length === 1 ? "" : "s"}` : `${list.length} of ${all.length} brews`}</span>`, false);

  let grid = "";
  if (historyGrid != null) {
    const years = months.map((m) => Number(m.slice(0, 4)));
    const minY = Math.min(...years), maxY = Math.max(...years);
    const y = historyGrid;
    grid = `<div class="hgrid" role="dialog" aria-label="Pick a month">
      <div class="hgy"><button type="button" class="hstep sm" data-gy="${y - 1}" ${y <= minY ? "disabled" : ""} aria-label="Previous year">${ARROW("l")}</button>
        <b>${y}</b><button type="button" class="hstep sm" data-gy="${y + 1}" ${y >= maxY ? "disabled" : ""} aria-label="Next year">${ARROW("r")}</button></div>
      <div class="hgm">${Array.from({ length: 12 }, (_, k) => { const ym = `${y}-${pad2(k + 1)}`; return `<button type="button" data-gm="${ym}" class="${ym === historyMonth ? "on" : ""}" ${months.includes(ym) ? "" : "disabled"}>${monthName(ym, "short")}</button>`; }).join("")}</div>
      <button type="button" class="hgall" data-gm="all">All months</button></div>`;
  }

  main.innerHTML = `
    <div class="hfilt">
      <label class="hbag"><span class="sr">Filter by bag</span><select id="hBag"><option value="all">All bags</option>
        ${bagsUsed.map((g) => `<option value="${g.id}" ${g.id === historyBag ? "selected" : ""}>${esc(bagName(g))}</option>`).join("")}</select>${CHEV}</label>
      <div class="hmonth">
        <button type="button" class="hstep" data-gm="${olderM || ""}" ${olderM ? "" : "disabled"} aria-label="Previous month">${ARROW("l")}</button>
        <button type="button" class="hmlabel" id="hMonth" aria-expanded="${historyGrid != null}">${historyMonth === "all" ? "All months" : monthName(historyMonth)}</button>
        <button type="button" class="hstep" data-gm="${newerM || ""}" ${newerM ? "" : "disabled"} aria-label="Next month">${ARROW("r")}</button>
        ${grid}
      </div>
    </div>
