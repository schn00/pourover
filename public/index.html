// Insights
// =====================================================================
function factorDefs() {
  const lowerFiner = settings().finerIsLower;
  const bagMeans = {};
  for (const b of brews()) { const g = numGrind(b.grind); if (g == null) continue; (bagMeans[b.bagId] ||= []).push(g); }
  for (const k in bagMeans) bagMeans[k] = bagMeans[k].reduce((a, x) => a + x, 0) / bagMeans[k].length;
  const side = (v) => (Math.abs(v) < 0.05 ? "usual" : (lowerFiner ? v < 0 : v > 0) ? "finer" : "coarser");
  const rel = (v) => (side(v) === "usual" ? "usual setting" : `${round(Math.abs(v), 1)} ${side(v)}`);
  const relRange = (lo, hi) => {
    if (side(lo) === side(hi) && side(lo) !== "usual") { const a = [round(Math.abs(lo), 1), round(Math.abs(hi), 1)].sort((x, y) => x - y); return `${a[0] === a[1] ? a[0] : a[0] + " to " + a[1]} ${side(lo)} than usual`; }
    return `${rel(lo)} to ${rel(hi)}`;
  };
  const unitRange = (u, d = 0) => (lo, hi) => (round(lo, d) === round(hi, d) ? `${round(lo, d)} ${u}` : `${round(lo, d)} to ${round(hi, d)} ${u}`);
  return [
    { k: "days", name: "Days off roast", get: (b) => { const g = S.records[b.bagId]; return g ? daysOff(g, b.date)?.adjusted : null; }, fmt: (v) => `${Math.round(v)} days`, range: unitRange("days") },
    { k: "temp", name: "Temperature", get: (b) => b.tempF, fmt: (v) => tempStr(v) },
    { k: "ratio", name: "Ratio", get: ratio, fmt: (v) => ratioStr(v) },
    { k: "grind", name: "Grind vs. that bag's usual", get: (b) => { const g = numGrind(b.grind); return g == null || bagMeans[b.bagId] == null ? null : g - bagMeans[b.bagId]; }, fmt: rel, range: relRange },
    { k: "time", name: "Brew time", get: (b) => b.timeS, fmt: mmss },
    { k: "bloomS", name: "Bloom time", get: (b) => b.bloomS, fmt: (v) => `${Math.round(v)} s`, range: unitRange("s") },
    { k: "pours", name: "Pours", get: (b) => b.pours, fmt: (v) => `${round(v, 1)}` },
    { k: "dose", name: "Coffee dose", get: (b) => b.dose, fmt: (v) => `${round(v, 1)} g`, range: unitRange("g", 1) },
  ];
}
const catDefs = [
  { k: "brewer", name: "Brewer", get: (b) => b.brewer },
  { k: "waterType", name: "Type of water", get: (b) => b.waterType },
  { k: "filter", name: "Filter", get: (b) => b.filter },
  { k: "grinder", name: "Grinder", get: (b) => b.grinder },
  { k: "roastType", name: "Roast type", get: (b) => S.records[b.bagId]?.roastType },
];
const mean = (a) => a.reduce((s, x) => s + x, 0) / a.length;

function analyse(rated) {
  const rows = [];
  for (const f of factorDefs()) {
    const pts = rated.map((b) => ({ v: f.get(b), r: b.rating })).filter((p) => isNum(p.v)).sort((a, b) => a.v - b.v);
    const distinct = [...new Set(pts.map((p) => p.v))];
    if (pts.length < 6 || distinct.length < 2) continue;
    let groups;
    if (distinct.length <= 3) groups = distinct.map((v) => pts.filter((p) => p.v === v));
    else { const n = pts.length; groups = [pts.slice(0, Math.round(n / 3)), pts.slice(Math.round(n / 3), Math.round((2 * n) / 3)), pts.slice(Math.round((2 * n) / 3))]; }
    groups = groups.filter((g) => g.length >= 2).map((g) => ({ lo: g[0].v, hi: g.at(-1).v, m: mean(g.map((p) => p.r)), n: g.length }));
    if (groups.length < 2) continue;
    const best = groups.reduce((a, g) => (g.m > a.m ? g : a)), worst = groups.reduce((a, g) => (g.m < a.m ? g : a));
    const range = (g) => (f.range ? f.range(g.lo, g.hi) : f.fmt(g.lo) === f.fmt(g.hi) ? f.fmt(g.lo) : `${f.fmt(g.lo)} to ${f.fmt(g.hi)}`);
    rows.push({ name: f.name, spread: best.m - worst.m, n: pts.length, text: `Best around ${range(best)} (avg ${round(best.m, 1)}), vs ${round(worst.m, 1)} at ${range(worst)}.` });
  }
  for (const c of catDefs) {
    const by = {};
    for (const b of rated) { const v = (c.get(b) || "").trim(); if (v) (by[v] ||= []).push(b.rating); }
    const groups = Object.entries(by).filter(([, a]) => a.length >= 2).map(([v, a]) => ({ v, m: mean(a), n: a.length }));
    if (groups.length < 2) continue;
    const best = groups.reduce((a, g) => (g.m > a.m ? g : a)), worst = groups.reduce((a, g) => (g.m < a.m ? g : a));
    rows.push({ name: c.name, spread: best.m - worst.m, n: groups.reduce((s, g) => s + g.n, 0), text: `${best.v} scores best (avg ${round(best.m, 1)}), ${worst.v} lowest (avg ${round(worst.m, 1)}).` });
  }
  return rows.sort((a, b) => b.spread - a.spread);
}

let insightFactor = "days", insightBag = "all";
function viewInsights() {
  const all = brews();
  const rated = all.filter((b) => isNum(b.rating));
  const need = 5;
  if (rated.length < need) {
    setBand("Insights", "", false);
    main.innerHTML = `<div class="empty"><h1>Insights need a few more cups</h1><p>Rate ${need - rated.length} more brew${need - rated.length === 1 ? "" : "s"} and this page will start showing which factors move your ratings.</p><button class="btn primary" type="button" data-go="log">Log a brew</button></div>${tasteMap(all)}`;
    return;
  }
  const last10 = rated.slice(0, 10);
  const byBag = {};
  rated.forEach((b) => (byBag[b.bagId] ||= []).push(b.rating));
  const topBag = Object.entries(byBag).filter(([, a]) => a.length >= 2).map(([id, a]) => ({ id, m: mean(a) })).sort((a, b) => b.m - a.m)[0];
  const rows = analyse(rated);
  const maxSpread = Math.max(3, ...rows.map((r) => r.spread));
  const defs = factorDefs();
  if (!defs.some((f) => f.k === insightFactor)) insightFactor = "days";
  const f = defs.find((x) => x.k === insightFactor);
  const bagsUsed = [...new Set(rated.map((b) => b.bagId))].map((id) => S.records[id]).filter(Boolean);
  const pts = rated.filter((b) => insightBag === "all" || b.bagId === insightBag).map((b) => ({ x: f.get(b), y: b.rating })).filter((p) => isNum(p.x));

  setBand("Insights", `<span class="bandnote">${rated.length} rated</span>`, false);
  main.innerHTML = `
    <div class="srow metrics">
      <div class="num"><span class="nlab">brews logged</span><span class="stat">${all.length}</span></div>
      <div class="num"><span class="nlab">average, last ${last10.length}</span><span class="stat">${round(mean(last10.map((b) => b.rating)), 1)}</span></div>
      <div class="num"><span class="nlab">top bag</span><span class="stat name">${topBag ? esc(S.records[topBag.id]?.beans || "\u2013") : "\u2013"}${topBag ? `<i>avg ${round(topBag.m, 1)}</i>` : ""}</span></div>
    </div>

    <div class="srow"><h2>what&rsquo;s making the difference</h2>
      ${rows.length ? rows.map((r) => `<div class="factor"><div class="fh"><b>${esc(r.name)}</b><span>${r.spread >= 2 ? "big difference" : r.spread >= 1 ? "some difference" : "little difference so far"}</span></div>
        <p>${esc(r.text)}</p><div class="bar"><i style="width:${clamp((r.spread / maxSpread) * 100, 3, 100)}%"></i></div></div>`).join("")
        : `<p class="beanline">Fill in more recipe details (temperature, ratio, grind) and vary them a little to see what matters.</p>`}
      <p class="foot">Based on ${rated.length} rated brews. Each factor splits your brews into low, middle and high groups and compares their average rating. It gets more reliable as you log more.</p>
    </div>

    <div class="srow"><h2>rating against a factor</h2>
      <div class="selpair">
        <label class="selline"><span>factor</span><select id="iFactor" aria-label="Factor">${defs.map((x) => `<option value="${x.k}" ${x.k === insightFactor ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>
        <label class="selline"><span>bag</span><select id="iBag" aria-label="Bag"><option value="all">all bags</option>${bagsUsed.map((g) => `<option value="${g.id}" ${g.id === insightBag ? "selected" : ""}>${esc(bagName(g))}</option>`).join("")}</select></label>
      </div>
      ${pts.length >= 2 ? scatter(pts, f.fmt) : `<p class="beanline">Not enough brews with this detail yet.</p>`}
    </div>
    ${tasteMap(all)}`;
  $("#iFactor").onchange = (e) => { insightFactor = e.target.value; viewInsights(); };
  $("#iBag").onchange = (e) => { insightBag = e.target.value; viewInsights(); };
}

function scatter(pts, fmt) {
  const W = clamp(Math.round(main.clientWidth - 34), 280, 640), H = Math.round(clamp(W * 0.55, 200, 300)), P = { l: 30, r: 14, t: 10, b: 28 };
  let x0 = Math.min(...pts.map((p) => p.x)), x1 = Math.max(...pts.map((p) => p.x));
  if (x0 === x1) { x0 -= 1; x1 += 1; }
  const padX = (x1 - x0) * 0.06; x0 -= padX; x1 += padX;
  const sx = (v) => P.l + ((v - x0) / (x1 - x0)) * (W - P.l - P.r);
  const sy = (r) => P.t + ((10 - r) / 9) * (H - P.t - P.b);
  const xt = [0, 1, 2, 3].map((i) => x0 + padX + (i * (x1 - x0 - 2 * padX)) / 3);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Scatter chart of rating against the chosen factor">
    ${[1, 4, 7, 10].map((r) => `<line class="grid-l" x1="${P.l}" x2="${W - P.r}" y1="${sy(r)}" y2="${sy(r)}"/><text x="${P.l - 8}" y="${sy(r) + 4}" text-anchor="end">${r}</text>`).join("")}
    ${xt.map((v) => `<text x="${sx(v)}" y="${H - 8}" text-anchor="middle">${esc(fmt(v))}</text>`).join("")}
    ${pts.map((p) => `<circle class="pt" cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="6"/>`).join("")}
  </svg>`;
}

function tasteMap(all) {
  const t = all.filter((b) => b.taste);
  if (t.length < 2) return "";
  const W = 260;
  return `<div class="srow"><h2>where your cups land</h2>
    <p class="beanline" style="margin-bottom:4px">Darker dots scored higher. A cluster left of center means you tend to under-extract; right of center, over-extract.</p>
    <svg class="chart" viewBox="0 0 ${W} ${W}" style="max-width:260px;margin:0 auto" role="img" aria-label="Taste map of your brews">
      <defs>
        <linearGradient id="tmx" x1="0" x2="1">
          <stop offset="0" stop-color="var(--sour-deep)" stop-opacity=".40"/>
          <stop offset=".44" stop-color="var(--sour-deep)" stop-opacity="0"/>
          <stop offset=".56" stop-color="var(--accent)" stop-opacity="0"/>
          <stop offset="1" stop-color="var(--accent)" stop-opacity=".34"/>
        </linearGradient>
        <radialGradient id="tmc">
          <stop offset="0" stop-color="var(--good)" stop-opacity=".30"/>
          <stop offset=".55" stop-color="var(--good)" stop-opacity=".12"/>
          <stop offset="1" stop-color="var(--good)" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect x="1" y="1" width="${W - 2}" height="${W - 2}" fill="url(#tmx)"/>
      <circle cx="${W / 2}" cy="${W / 2}" r="${W * 0.46}" fill="url(#tmc)"/>
      <circle cx="${W / 2}" cy="${W / 2}" r="${W * 0.125}" fill="none" stroke="var(--good)" stroke-opacity=".5" stroke-dasharray="3 3"/>
      <rect x="0.5" y="0.5" width="${W - 1}" height="${W - 1}" rx="2" fill="none" stroke="var(--line)"/>
      <line class="grid-l" x1="${W / 2}" x2="${W / 2}" y1="0" y2="${W}"/><line class="grid-l" y1="${W / 2}" y2="${W / 2}" x1="0" x2="${W}"/>
      <text x="${W / 2}" y="14" text-anchor="middle">strong</text><text x="${W / 2}" y="${W - 6}" text-anchor="middle">weak</text>
      <text x="6" y="${W / 2 - 6}">sour</text><text x="${W - 6}" y="${W / 2 - 6}" text-anchor="end">bitter</text>
      ${t.map((b) => `<circle cx="${(((b.taste.x + 1) / 2) * (W - 24) + 12).toFixed(1)}" cy="${(((1 - b.taste.y) / 2) * (W - 24) + 12).toFixed(1)}" r="7" fill="var(--accent)" fill-opacity="${isNum(b.rating) ? (0.15 + 0.85 * (b.rating - 1) / 9).toFixed(2) : 0.12}" stroke="var(--accent)" stroke-opacity=".5"/>`).join("")}
    </svg></div>`;
}

// Two-tap confirm: first tap arms the button, second tap acts. Works where popups are blocked.
function armed(btn, label) {
  if (btn.dataset.armed) return true;
  const orig = btn.textContent;
  btn.dataset.armed = "1"; btn.textContent = label;
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = orig; } }, 4000);
  return false;
}
let toastT;
function toast(msg) {
  let el = $(".toast");
  if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => (el.hidden = true), 2800);
}

function applyTheme() {
  const pref = LS.get("brewlog:theme") || "auto";
  const dark = pref === "dark" || (pref === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

function openSettings() {
  const st = settings();
  const theme = LS.get("brewlog:theme") || "auto";
  const seg = (name, opts, cur) => `<div class="seg" data-seg="${name}">${opts.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${String(v) === String(cur)}">${l}</button>`).join("")}</div>`;
  const statusText = { synced: "Everything is saved to your account.", saving: "Saving changes.", offline: "You're offline. Changes are saved on this device and upload when you reconnect.", signin: "Not signed in, so this device is on its own. Sign in to sync everywhere.", error: "The server couldn't save. Changes are kept on this device.", local: "No sync at this address, so this device is on its own. Changes are saved here and can be exported." }[S.status] || "";
  openSheet(`
    <div class="sheet-head"><h1>Settings</h1><button class="iconbtn" data-close type="button" aria-label="Close">✕</button></div>
    <div class="setrow"><div><div style="font-weight:600">${esc(S.email || "Not signed in")}</div><div class="muted small">${esc(statusText)}</div></div>
      ${S.status === "signin" ? `<button class="btn sm primary" id="reauth" type="button">Sign in</button>` : `<button class="btn sm" id="syncNow" type="button">${S.status === "local" ? "Check again" : "Sync now"}</button>`}</div>
    <div class="setrow"><span>Temperature</span>${seg("tempUnit", [["F", "°F"], ["C", "°C"]], st.tempUnit)}</div>
    <div class="setrow"><span>On my grinder, a lower number is</span>${seg("finerIsLower", [["true", "Finer"], ["false", "Coarser"]], st.finerIsLower)}</div>
    <div class="setrow"><span>Theme</span>${seg("theme", [["auto", "Auto"], ["light", "Light"], ["dark", "Dark"]], theme)}</div>
    <div class="setrow"><div><div>Export</div><div class="muted small">Brews and bags, with the columns from your spreadsheet</div></div>
      <div style="display:flex;gap:6px"><button class="btn sm" id="expX" type="button">Excel</button><button class="btn sm" id="expC" type="button">CSV</button></div></div>
    <div class="setrow"><div><div>Import</div><div class="muted small">Excel or CSV. Re-importing an export updates brews instead of duplicating them.</div></div>
      <label class="btn sm" style="flex:none">Choose file<input type="file" id="impF" accept=".xlsx,.xls,.csv" class="sr"></label></div>
    ${S.email ? `<div class="setrow"><div><div>Sign out</div><div class="muted small">Signs out on this device. Your brews stay in your account.</div></div><button class="btn sm" style="flex:none" id="signOut" type="button">Sign out</button></div>` : ""}
  `, (root) => {
    $$("[data-seg]", root).forEach((g) => g.addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      const name = g.dataset.seg, v = b.dataset.v;
      if (name === "theme") { LS.set("brewlog:theme", v); applyTheme(); }
      else {
        const prevUnit = settings().tempUnit;
        saveSetting(name, name === "finerIsLower" ? v === "true" : v);
        const inp = FORM && $('#brewForm [data-k="temp"]');
        if (name === "tempUnit" && inp && prevUnit !== v) {
          const t = num(inp.value);
          if (t != null) inp.value = v === "C" ? round(fToC(t) * 2) / 2 : round(cToF(t), 1);
          inp.placeholder = v === "C" ? 94 : 200;
          const lab = inp.closest(".num");
          if (lab) { lab.querySelector(".nlab").textContent = "temperature"; const u = lab.querySelector("i"); if (u) u.textContent = "°" + v; }
        }
      }
      $$("button", g).forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    }));
    const sn = $("#syncNow", root); if (sn) sn.onclick = () => { sync(); closeSheet(); };
    const ra = $("#reauth", root); if (ra) ra.onclick = openSignIn;
    const so = $("#signOut", root); if (so) so.onclick = () => { if (armed(so, "Sign out?")) signOut(); };
    $("#expX", root).onclick = () => exportFile("xlsx");
    $("#expC", root).onclick = () => exportFile("csv");
    $("#impF", root).onchange = (e) => { const f = e.target.files[0]; if (f) importFile(f); };
  });
}
$("#openSettings").onclick = openSettings;
$("#status").onclick = () => (S.status === "signin" ? openSignIn() : sync());

// =====================================================================
// Export / import (column names match the original Coffee.xlsx)
// =====================================================================
// Export columns, grouped the way you'd read a brew: when, which bag, how it was ground,
// water, pour, then how it turned out. Header names are what the importer matches on,
// so renaming one means adding an alias in importFile's pick() list.
const frozenOn = (g, date) => (g?.freezes || []).some((f) => f.start <= date && (!f.end || date <= f.end));

const BREW_COLS = [
  ["Brew ID", (b) => b.id],
  ["Brew Date", (b) => b.date],

  ["Bag ID", (b) => b.bagId],
  ["Beans", (b, g) => g?.beans],
  ["Roaster", (b, g) => g?.roaster],
  ["Roast Type", (b, g) => g?.roastType],
  ["Roast Date", (b, g) => g?.roastDate],
  ["Days from Roast", (b, g) => (g ? daysOff(g, b.date)?.adjusted : "")],
  ["Days Frozen", (b, g) => (g ? daysOff(g, b.date)?.frozen : "")],
  ["Frozen at Brew", (b, g) => (frozenOn(g, b.date) ? "Yes" : "")],
  ["Origin", (b, g) => g?.origin],
  ["Region", (b, g) => g?.region],
  ["Process", (b, g) => g?.process],
  ["Variety", (b, g) => g?.variety],
  ["Producer", (b, g) => g?.producer],
  ["Elevation (masl)", (b, g) => g?.elevation],
  ["Decaf", (b, g) => (g?.decaf ? "Yes" : "")],
  ["Notes on bag", (b, g) => g?.notes],

  ["Grinder", (b) => b.grinder],
  ["Grind Setting", (b) => b.grind],

  ["Coffee (g)", (b) => b.dose],
  ["Water (g)", (b) => b.waterG],
  ["Ratio", (b) => (ratio(b) ? round(ratio(b), 2) : "")],
  ["Temperature (°F)", (b) => b.tempF],
  ["Temperature (°C)", (b) => (isNum(b.tempF) ? round(fToC(b.tempF), 1) : "")],
  ["Type of water", (b) => b.waterType],

  ["Brewer", (b) => b.brewer],
  ["Filter", (b) => b.filter],
  ["Bloom (g)", (b) => b.bloomG],
  ["Bloom (s)", (b) => b.bloomS],
  ["Pours", (b) => b.pours],
  ["Brew Time", (b) => mmss(b.timeS)],
  ["Method", (b) => b.method],

  ["Result", (b) => b.rating],
  ["Taste", (b) => tasteText(b.taste)],
  ["Sour to Bitter", (b) => b.taste?.x],
  ["Weak to Strong", (b) => b.taste?.y],
  ["Tasting notes", (b) => b.notes],
];
const BAG_COLS = [
  ["Bag ID", (g) => g.id],
  ["Beans", (g) => g.beans],
  ["Roaster", (g) => g.roaster],
  ["Roast Type", (g) => g.roastType],
  ["Roast Date", (g) => g.roastDate],
  ["Days from Roast", (g) => daysOff(g)?.adjusted ?? ""],
  ["Days Frozen", (g) => daysOff(g)?.frozen ?? ""],
  ["Currently Frozen", (g) => (isFrozen(g) ? "Yes" : "")],
  ["Origin", (g) => g.origin],
  ["Region", (g) => g.region],
  ["Process", (g) => g.process],
  ["Variety", (g) => g.variety],
  ["Producer", (g) => g.producer],
  ["Elevation (masl)", (g) => g.elevation],
  ["Decaf", (g) => (g.decaf ? "Yes" : "")],
  ["Notes on bag", (g) => g.notes],
  ["Freezer periods", (g) => (g.freezes || []).map((f) => `${f.start} to ${f.end || "still frozen"}`).join("; ")],
  ["Brews Logged", (g) => brews().filter((b) => b.bagId === g.id).length],
  ["Average Result", (g) => { const r = brews().filter((b) => b.bagId === g.id && isNum(b.rating)).map((b) => b.rating); return r.length ? round(mean(r), 1) : ""; }],
  ["Finished", (g) => (g.finished ? "Yes" : "")],
];
const brewRows = () => brews().slice().reverse().map((b) => { const g = S.records[b.bagId]; const o = {}; BREW_COLS.forEach(([h, fn]) => (o[h] = fn(b, g) ?? "")); return o; });
const bagRows = () => allBags().sort(byRoastDesc).map((g) => { const o = {}; BAG_COLS.forEach(([h, fn]) => (o[h] = fn(g) ?? "")); return o; });

function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = res;
    s.onerror = () => rej(new Error("Couldn't load the spreadsheet tool. Check your connection and try again."));
    document.head.appendChild(s);
  });
}
function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function exportFile(kind) {
  const stamp = today();
  if (kind === "csv") {
    const rows = brewRows();
    const heads = BREW_COLS.map(([h]) => h);
    const cell = (v) => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const csv = [heads.map(cell).join(","), ...rows.map((r) => heads.map((h) => cell(r[h])).join(","))].join("\n");
    download(new Blob(["\ufeff" + csv], { type: "text/csv" }), `dialed-brews-${stamp}.csv`);
    return;
  }
  try {
    await loadXLSX();
    const wb = XLSX.utils.book_new();
    const WIDE = { "Notes on bag": 42, "Tasting notes": 46, "Method": 26, "Taste": 30, "Freezer periods": 34,
      "Beans": 24, "Roaster": 20, "Brew ID": 14, "Bag ID": 14, "Producer": 22 };
    const widths = (cols) => cols.map(([h]) => ({ wch: WIDE[h] || Math.max(9, h.length + 2) }));
    const ws1 = XLSX.utils.json_to_sheet(brewRows(), { header: BREW_COLS.map(([h]) => h) });
    ws1["!cols"] = widths(BREW_COLS);
    ws1["!freeze"] = { xSplit: 2, ySplit: 1 };
    ws1["!autofilter"] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: brewRows().length, c: BREW_COLS.length - 1 } }) };
    const ws2 = XLSX.utils.json_to_sheet(bagRows(), { header: BAG_COLS.map(([h]) => h) });
    ws2["!cols"] = widths(BAG_COLS);
    ws2["!freeze"] = { xSplit: 1, ySplit: 1 };
    XLSX.utils.book_append_sheet(wb, ws1, "Brews");
    XLSX.utils.book_append_sheet(wb, ws2, "Bags");
    XLSX.writeFile(wb, `dialed-log-${stamp}.xlsx`);
  } catch (e) { toast(e.message); }
}

const normKey = (s) => String(s).toLowerCase().replace(/[^a-z0-9]/g, "");
function cellDate(v) {
  if (v instanceof Date && !isNaN(v)) return ymd(new Date(v.getTime() + 12 * 3600e3));
  if (isNum(v) && v > 20000) return ymd(new Date(Date.UTC(1899, 11, 30) + v * 864e5 + 12 * 3600e3));
  const s = String(v ?? "").trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) { const y = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]); return `${y}-${pad2(m[1])}-${pad2(m[2])}`; }
  return "";
}
function cellTime(v) {
  if (v instanceof Date && !isNaN(v)) { const h = v.getHours(), mi = v.getMinutes(), s = v.getSeconds(); return h > 0 && h < 15 && s === 0 ? h * 60 + mi : h * 3600 + mi * 60 + s; }
  if (isNum(v) && v > 0 && v < 1) { const secs = Math.round(v * 86400); return secs >= 3600 && secs % 60 === 0 ? secs / 60 : secs; } // "3:10" typed in Excel is read as 3 h 10 min
  return parseTime(v);
}
const pick = (row, ...keys) => { for (const k of keys) if (row[k] !== undefined && row[k] !== "") return row[k]; return ""; };
const str = (v) => (v instanceof Date ? cellDate(v) : String(v ?? "").trim());

async function importFile(file) {
  try {
    await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: true });
    const brewName = wb.SheetNames.find((n) => normKey(n) === "brews") || wb.SheetNames.find((n) => normKey(n) !== "bags");
    const bagName_ = wb.SheetNames.find((n) => normKey(n) === "bags");
    const rows = (name) => (name ? XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: "", raw: true }) : []).map((r) => { const o = {}; for (const k in r) o[normKey(k)] = r[k]; return o; });
    const out = [];
    const bagsById = Object.fromEntries(allBags().map((g) => [g.id, g]));
    const bagKey = (roaster, beans, rd) => [roaster, beans, rd].map((x) => String(x || "").toLowerCase().trim()).join("|");
    const bagsByKey = Object.fromEntries(allBags().map((g) => [bagKey(g.roaster, g.beans, g.roastDate), g]));
    let nBags = 0, nBrews = 0, nSkipped = 0;

    const normRoast = (v) => { const s = str(v); return ROAST_TYPES.find((r) => normKey(r) === normKey(s)) || s; };
    for (const r of rows(bagName_)) {
      const id = str(pick(r, "bagid"));
      const beans = str(pick(r, "beans")), roaster = str(pick(r, "roaster")), rd = cellDate(pick(r, "roastdate"));
      if (!beans && !roaster) continue;
      const existing = (id && bagsById[id]) || bagsByKey[bagKey(roaster, beans, rd)];
      const freezes = String(pick(r, "freezerperiods") || "").split(";").map((p) => { const d = p.match(/\d{4}-\d{2}-\d{2}/g) || []; return d[0] ? { start: d[0], end: d[1] || null } : null; }).filter(Boolean);
      const bag = { ...(existing || { id: id || uid(), type: "bag", createdAt: Date.now() }), roaster, beans, roastType: normRoast(pick(r, "roasttype")), roastDate: rd, notes: str(pick(r, "notesonbag", "bagnotes")), origin: str(pick(r, "origin", "country")), region: str(pick(r, "region")), process: str(pick(r, "process")), variety: str(pick(r, "variety", "cultivar")), producer: str(pick(r, "producer", "farm", "washingstation")), elevation: num(pick(r, "elevationmasl", "elevation", "altitude")), decaf: /^y/i.test(str(pick(r, "decaf"))), freezes, finished: /^y/i.test(str(pick(r, "finished"))) };
      bagsById[bag.id] = bag; bagsByKey[bagKey(roaster, beans, rd)] = bag; out.push(bag); nBags++;
    }

    const sig = (b) => [b.date, b.bagId, b.grind, b.rating, b.notes].join("|");
    const sigs = new Set(brews().map(sig));
    const brewsById = Object.fromEntries(brews().map((b) => [b.id, b]));
    for (const r of rows(brewName)) {
      if (!Object.values(r).some((v) => v !== "")) continue;
      const roaster = str(pick(r, "roaster")), beans = str(pick(r, "beans", "bean", "coffee")), rd = cellDate(pick(r, "roastdate"));
      let bag = bagsById[str(pick(r, "bagid"))] || bagsByKey[bagKey(roaster, beans, rd)];
      if (!bag) {
        bag = { id: uid(), type: "bag", createdAt: Date.now(), roaster, beans: beans || "Imported beans", roastType: normRoast(pick(r, "roasttype")), roastDate: rd, notes: str(pick(r, "notesonbag", "bagnotes")), origin: str(pick(r, "origin", "country")), region: str(pick(r, "region")), process: str(pick(r, "process")), variety: str(pick(r, "variety", "cultivar")), producer: str(pick(r, "producer", "farm", "washingstation")), elevation: num(pick(r, "elevationmasl", "elevation", "altitude")), decaf: /^y/i.test(str(pick(r, "decaf"))), freezes: [], finished: false };
        bagsById[bag.id] = bag; bagsByKey[bagKey(roaster, beans, rd)] = bag; out.push(bag); nBags++;
      }
      let tempF = num(pick(r, "temperaturef", "temperature", "temp", "tempf"));
      const tempC = num(pick(r, "temperaturec", "tempc"));
      // Our own export carries both columns; the F one is unrounded, so prefer it.
      if (tempF == null && tempC != null) tempF = cToF(tempC);
      else if (tempF != null && tempF < 110) tempF = cToF(tempF);
      let bloomG = num(pick(r, "bloomg")), bloomS = num(pick(r, "blooms")), method = str(pick(r, "method"));
      const bloomRaw = str(pick(r, "bloom"));
      if (bloomRaw && bloomG == null && bloomS == null) {
        const g = bloomRaw.match(/(\d+(?:\.\d+)?)\s*g/i), s = bloomRaw.match(/(\d+(?:\.\d+)?)\s*(s|sec)/i), all = bloomRaw.match(/\d+(?:\.\d+)?/g) || [];
        if (g || s) { bloomG = g ? Number(g[1]) : null; bloomS = s ? Number(s[1]) : null; }
        else if (all.length >= 2) { bloomG = Number(all[0]); bloomS = Number(all[1]); }
        else method = [`Bloom: ${bloomRaw}`, method].filter(Boolean).join(". ");
      }
      const resRaw = pick(r, "result", "rating", "result110");
      let rating = isNum(resRaw) ? resRaw : num(String(resRaw).match(/\d+(\.\d+)?/)?.[0]);
      let notes = str(pick(r, "tastingnotes", "notes"));
      if (rating != null) rating = clamp(Math.round(rating), 1, 10);
      else if (str(resRaw)) notes = [`Result: ${str(resRaw)}`, notes].filter(Boolean).join(". ");
      const tx = num(pick(r, "sourtobitter")), ty = num(pick(r, "weaktostrong"));
      const id = str(pick(r, "brewid"));
      const prev = id && brewsById[id];
      const brew = {
        ...(prev || {}), id: id || uid(), type: "brew", createdAt: prev?.createdAt || Date.now(),
        date: cellDate(pick(r, "brewdate", "date")) || today(), bagId: bag.id,
        grinder: str(pick(r, "grinder")), grind: str(pick(r, "grindsetting", "grind")),
        tempF: tempF == null ? null : round(tempF, 1), waterType: str(pick(r, "typeofwater", "watertype")), brewer: str(pick(r, "brewer")), filter: str(pick(r, "filter", "filtertype", "paper")),
        dose: num(pick(r, "coffeeg", "dose", "doseg")), waterG: num(pick(r, "waterg", "wateramount")),
        bloomG, bloomS, method, pours: num(pick(r, "pours")), timeS: cellTime(pick(r, "brewtime", "time")),
        rating, taste: tx != null && ty != null ? { x: clamp(tx, -1, 1), y: clamp(ty, -1, 1) } : prev?.taste || null, notes,
      };
      if (!prev && sigs.has(sig(brew))) { nSkipped++; continue; }
      sigs.add(sig(brew)); out.push(brew); nBrews++;
    }
    if (!out.length) {
      closeSheet();
      toast(nSkipped ? `Nothing new. All ${nSkipped} brew${nSkipped === 1 ? " is" : "s are"} already in your log.` : "No brews or bags found in that file.");
      return;
    }
    putRecords(out);
    closeSheet();
    toast(`Imported ${nBrews} brew${nBrews === 1 ? "" : "s"} and ${nBags} bag${nBags === 1 ? "" : "s"}${nSkipped ? `, skipped ${nSkipped} duplicate${nSkipped === 1 ? "" : "s"}` : ""}.`);
    route();
  } catch (e) { console.error(e); toast(e.message || "Couldn't read that file."); }
}

// =====================================================================
// Boot
// =====================================================================
try { applyTheme(); } catch {}
loadStore(LS.get("brewlog:lastEmail"));
const CAN_SYNC = /^https?:$/.test(location.protocol);
setStatus(CAN_SYNC ? "idle" : "local");
window.addEventListener("online", () => scheduleSync(100));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") scheduleSync(100); });
route();
if (CAN_SYNC) {
  sync();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
}
