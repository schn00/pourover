<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dialed</title>
<meta name="apple-mobile-web-app-title" content="Dialed">
<meta name="theme-color" content="#F4F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0E14" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F8;--surface:#FFFFFF;--ink:#0F1222;--muted:#5E6272;--faint:#9095A3;--line:#DFE2EA;
  --accent:#2F5BFF;--accent-ink:#FFFFFF;--accent-soft:#E7ECFF;--accent-text:#1E40D8;
  --lime:#C6F432;--lime-ink:#2E3B00;--sour:#FFD23F;--sour-text:#8A6A00;
  --frozen-bg:#DDF4FA;--frozen-text:#0B6F86;--good:#1F9D57;--warn:#D9480F;
  --font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0C0E14;--surface:#151822;--ink:#E8EAF2;--muted:#9AA0B2;--faint:#666C7E;--line:#262A37;
  --accent:#7090FF;--accent-ink:#0A0F2E;--accent-soft:#1B2447;--accent-text:#AFC0FF;
  --lime:#C6F432;--lime-ink:#243000;--sour:#FFD23F;--sour-text:#FFD23F;
  --frozen-bg:#0F3340;--frozen-text:#7FDCF0;--good:#4ADE80;--warn:#FF8A5B;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100dvh}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-size:26px;line-height:1.15;font-weight:650;letter-spacing:-0.01em;margin:0;font-variation-settings:"opsz" 60}
h2{font-size:15px;font-weight:600;margin:0 0 12px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}

/* shell */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--line)}
.brand{font-weight:650;font-size:17px;letter-spacing:-0.01em;margin-right:auto;font-variation-settings:"opsz" 30}
.brand{display:flex;align-items:center;gap:8px}
.brand .logo{width:26px;height:26px;flex:none}
.status{display:grid;place-items:center;width:36px;height:36px;color:var(--muted);background:none;border:0;padding:0;border-radius:8px;cursor:pointer}
.status:hover{background:var(--surface)}
.status svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.status[data-s="signin"],.status[data-s="offline"],.status[data-s="error"]{color:var(--warn)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status[data-s="synced"] i{background:var(--good)}
.status[data-s="saving"] i{background:var(--accent)}
.status[data-s="synced"] i{background:var(--good)}
.status[data-s="offline"] i,.status[data-s="error"] i,.status[data-s="signin"] i{background:var(--warn)}
.iconbtn{display:grid;place-items:center;width:36px;height:36px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--surface);color:var(--ink)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;font-size:11px;text-decoration:none;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg,.iconbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
main{max-width:720px;margin:0 auto;padding:20px 16px 110px}
@media (min-width:900px){
  body{padding-left:88px}
  .tabs{top:0;right:auto;width:88px;flex-direction:column;justify-content:flex-start;gap:4px;padding:72px 0 0;border-top:0;border-right:1px solid var(--line)}
  .tabs button{flex:0;padding:12px 4px}
  main{padding-bottom:48px}
}

/* building blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:560px){.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.wide{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:12px;color:var(--muted)}
input,select,textarea{width:100%;min-height:44px;padding:9px 11px;font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:9px;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
input[type="date"]{min-width:0}
.out{min-height:44px;display:flex;align-items:center;padding:0 11px;border-radius:9px;background:var(--bg);font-weight:600}
.stepper{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:4px}
.stepper input{text-align:center}
.stepper button{border:1px solid var(--line);background:var(--surface);border-radius:9px;font-size:18px;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;font-weight:500;text-decoration:none}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--warn)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.actions .btn.primary{flex:1 1 200px}
.chip{display:inline-flex;align-items:baseline;gap:6px;padding:6px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent-text);font-size:13px;font-weight:600}
.chip.lime{background:var(--lime);color:var(--lime-ink)}
.chip.frozen{background:var(--frozen-bg);color:var(--frozen-text)}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pagehead input[type="date"]{width:auto;min-height:38px;font-size:14px}
.roastinfo{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}
.empty{text-align:center;padding:48px 16px}
.empty h1{margin-bottom:8px}
.empty p{color:var(--muted);margin-bottom:20px}

/* taste compass: the one bold element */
.taste{display:grid;gap:20px}
@media (min-width:560px){.taste{grid-template-columns:260px minmax(0,1fr);align-items:start}}
.compass{position:relative;width:100%;max-width:280px;aspect-ratio:1;margin:0 auto;border-radius:18px;border:1px solid var(--line);overflow:hidden;touch-action:none;cursor:crosshair;user-select:none;background:
  linear-gradient(to right,color-mix(in srgb,var(--sour) 34%,transparent),transparent 45%,transparent 55%,color-mix(in srgb,var(--accent) 20%,transparent))}
.compass::before,.compass::after{content:"";position:absolute;background:var(--line)}
.compass::before{left:50%;top:0;bottom:0;width:1px}
.compass::after{top:50%;left:0;right:0;height:1px}
.compass .zone{position:absolute;left:37.5%;top:37.5%;width:25%;height:25%;border:1px dashed var(--faint);border-radius:50%}
.compass .ax{position:absolute;font-size:12px;font-weight:600;color:var(--muted);pointer-events:none;background:var(--surface);padding:1px 6px;border-radius:5px;z-index:1}
.ax.t{top:8px;left:50%;transform:translateX(-50%)}.ax.b{bottom:8px;left:50%;transform:translateX(-50%)}
.ax.l{left:8px;top:50%;transform:translateY(-50%);color:var(--sour-text)}.ax.r{right:8px;top:50%;transform:translateY(-50%);color:var(--accent-text)}
.compass .dot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--ink);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--ink);z-index:2;transition:left .08s,top .08s}
.tastelabel{text-align:center;margin-top:8px;font-weight:600}
.tastelabel button{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;margin-left:6px}
.rate{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.rate button{min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-weight:600;padding:0}
.rate button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rate-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}

/* brew detail + advice */
.score{font-size:56px;line-height:1;font-weight:700;letter-spacing:-0.03em;font-variation-settings:"opsz" 96}
.score small{font-size:18px;color:var(--muted);font-weight:500;letter-spacing:0}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:0}
@media (min-width:560px){.facts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.facts div{min-width:0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.advice{border-color:var(--accent);border-width:1.5px}
.advice .lead{font-size:19px;font-weight:650;line-height:1.3;margin-bottom:4px}
.advice .why{color:var(--muted);font-size:14px}
.advice h3{font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.advice ul{margin:0;padding-left:18px}
.advice li{margin:4px 0}
.advice li span{display:block;color:var(--muted);font-size:13px}
.note{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
.note+.note{margin-top:8px;padding-top:0;border-top:0}

/* lists */
.list{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;font:inherit;color:inherit;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;text-decoration:none;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.linkbtn{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer}
.row:hover{background:color-mix(in srgb,var(--bg) 60%,transparent)}
.rt{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:18px;font-weight:700;background:var(--bg)}
.rt.hi{background:var(--lime);color:var(--lime-ink)}
.rt.none{color:var(--faint);font-weight:500}
.t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date{font-size:13px;color:var(--muted);text-align:right}
.toolbar{display:flex;gap:8px;align-items:center;margin-top:16px}
.toolbar select{flex:1}

/* bags */
.bag{display:grid;gap:10px}
.bag .t1{font-size:17px;white-space:normal}
.bag .btns{display:flex;flex-wrap:wrap;gap:6px}
.freezes{display:grid;gap:8px}
.freeze{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;gap:6px;align-items:end}
details summary{cursor:pointer;color:var(--muted);margin-top:20px;font-size:14px}

/* insights */
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.metric b{display:block;font-size:22px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.metric span{font-size:12px;color:var(--muted)}
.factor{padding:12px 0;border-top:1px solid var(--line)}
.factor:first-of-type{border-top:0;padding-top:0}
.factor .fh{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.factor .fh span{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.factor p{font-size:14px;color:var(--muted);margin-top:2px}
.bar{height:6px;border-radius:3px;background:var(--bg);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:12px;font-family:var(--font)}
svg.chart .grid-l{stroke:var(--line)}
svg.chart .pt{fill:var(--accent);fill-opacity:.75}

/* sheet */
dialog.sheet{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(560px,100%);max-height:92dvh;border-radius:18px;margin:auto}
dialog.sheet::backdrop{background:rgba(10,8,6,.45)}
@media (max-width:600px){dialog.sheet{margin:auto 0 0;max-width:100%;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom)}}
.sheet-body{padding:20px 18px;overflow:auto;max-height:92dvh}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-head h1{font-size:21px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90vw}
@media (min-width:900px){.toast{bottom:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="top">
  <span class="brand"><svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="116" fill="#2F5BFF"/><rect x="138" y="118" width="236" height="28" rx="14" fill="#FFFFFF"/><path d="M160 146 H352 L290 262 H222 Z" fill="#FFFFFF"/><path d="M146 330 A124 124 0 0 0 366 330" fill="none" stroke="#FFFFFF" stroke-opacity=".3" stroke-width="26" stroke-linecap="round"/><path d="M146 330 A124 124 0 0 0 277.54 394.88" fill="none" stroke="#C6F432" stroke-width="26" stroke-linecap="round"/><path d="M256 288 C256 288 240 309 240 320 A16 16 0 0 0 272 320 C272 309 256 288 256 288Z" fill="#C6F432"/></svg>Dialed</span>
  <button class="status" id="status" data-s="idle" type="button" aria-label="Loading"><i></i></button>

    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<nav class="tabs" aria-label="Main">
  <button type="button" data-go="log" data-tab="log"><svg viewBox="0 0 24 24"><path d="M4 5h16l-5 8H9z"/><path d="M12 13v3"/><path d="M6 17h12v1a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3z"/></svg>Log a brew</button>
  <button type="button" data-go="history" data-tab="history"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>History</button>
  <button type="button" data-go="insights" data-tab="insights"><svg viewBox="0 0 24 24"><path d="M4 20V4"/><path d="M4 20h16"/><circle cx="9" cy="14" r="1.4"/><circle cx="13" cy="9" r="1.4"/><circle cx="17" cy="12" r="1.4"/><circle cx="19" cy="6" r="1.4"/></svg>Insights</button>
  <button type="button" data-go="bags" data-tab="bags"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 12.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Bags</button>
</nav>

<script>
"use strict";
// =====================================================================
// Basics
// =====================================================================
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const main = $("#main");
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const round = (v, d = 0) => { const m = 10 ** d; return Math.round(v * m) / m; };
const num = (v) => { if (v === "" || v == null) return null; const n = Number(String(v).replace(",", ".")); return isFinite(n) ? n : null; };
const isNum = (v) => typeof v === "number" && isFinite(v);

const ROAST_TYPES = ["Light", "Medium-light", "Medium", "Medium-dark", "Dark"];
const BREWERS = ["V60", "Kalita Wave", "Chemex", "Origami", "Orea", "April", "Hario Switch"];
const WATERS = ["Filtered", "Tap", "Spring", "Third Wave Water", "Distilled + minerals"];

// Dates are stored as local "YYYY-MM-DD" strings.
const pad2 = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const today = () => ymd(new Date());
const dayNum = (s) => { if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return NaN; const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
function fmtDate(s, withYear) {
  if (!s) return "";
  const [y, m, d] = s.split("-").map(Number);
  const opts = { month: "short", day: "numeric" };
  if (withYear || y !== new Date().getFullYear()) opts.year = "numeric";
  return new Date(y, m - 1, d).toLocaleDateString(undefined, opts);
}
const mmss = (s) => (isNum(s) ? `${Math.floor(s / 60)}:${pad2(Math.round(s % 60))}` : "");
function parseTime(v) {
  v = String(v ?? "").trim();
  if (!v) return null;
  const m = v.match(/^(\d+):(\d{1,2})$/);
  if (m) return Number(m[1]) * 60 + Number(m[2]);
  const n = num(v);
  if (n == null) return null;
  return n < 15 ? Math.round(n * 60) : Math.round(n); // "3.5" = minutes, "190" = seconds
}
// Right-anchored m:ss mask so the numeric keypad alone can type a time:
// "3" -> 0:03, "31" -> 0:31, "310" -> 3:10, "1045" -> 10:45
function maskTime(v) {
  const d = String(v ?? "").replace(/\D/g, "").slice(-4);
  if (!d) return "";
  if (d.length <= 2) return `0:${d.padStart(2, "0")}`;
  return `${d.slice(0, -2)}:${d.slice(-2)}`;
}
// Roll overflowing seconds up into minutes: "4:75" -> 5:15

}

// =====================================================================
// State + storage
// =====================================================================
// Some browsers and embedded previews block storage and throw on any access.
// Fall back to memory so the app still works (data just won't survive a reload).
const LS = (() => {
  const mem = {};

  try { const k = "__brewlog_test"; window.localStorage.setItem(k, "1"); window.localStorage.removeItem(k); ok = true; } catch {}

    get: (k) => { if (ok) { try { return window.localStorage.getItem(k); } catch {} } return k in mem ? mem[k] : null; },
    set: (k, v) => { if (ok) { try { window.localStorage.setItem(k, v); return true; } catch { return false; } } mem[k] = String(v); return true; },
    remove: (k) => { if (ok) { try { window.localStorage.removeItem(k); } catch {} } delete mem[k]; },

})();
const S = { email: null, verified: false, records: {}, pending: new Set(), status: "idle" };
const storeKey = (email) => "brewlog:data:" + (email || "local");

function loadStore(email) {
  let d = {};
  try { d = JSON.parse(LS.get(storeKey(email)) || "{}"); } catch {}
  S.email = email || null;
  S.records = d.records || {};
  S.pending = new Set(d.pending || []);
}
function persist() {
  if (!LS.set(storeKey(S.email), JSON.stringify({ records: S.records, pending: [...S.pending] }))) toast("This device is out of storage space.");
}
function putRecords(list) {
  const now = Date.now();
  list.forEach((r, i) => { r.updatedAt = now + i; S.records[r.id] = r; S.pending.add(r.id); });
  persist();
  scheduleSync();
}
const put = (r) => putRecords([r]);
const live = (r) => r && !r.deleted;
const allBags = () => Object.values(S.records).filter((r) => r.type === "bag" && live(r));
const activeBags = () => allBags().filter((b) => !b.finished).sort(byRoastDesc);
const byRoastDesc = (a, b) => (b.roastDate || "").localeCompare(a.roastDate || "") || (b.createdAt || 0) - (a.createdAt || 0);
const brews = () => Object.values(S.records).filter((r) => r.type === "brew" && live(r))
  .sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || 0) - (a.createdAt || 0));
const settings = () => ({ tempUnit: "F", finerIsLower: true, ...(S.records.settings || {}) });
function saveSetting(k, v) { put({ ...settings(), id: "settings", type: "settings", [k]: v }); }

// =====================================================================
// Coffee math
// =====================================================================
function daysOff(bag, dateStr) {
  const r = dayNum(bag?.roastDate), t = dayNum(dateStr || today());
  if (isNaN(r) || isNaN(t)) return null;
  let frozen = 0;
  for (const f of bag.freezes || []) {
    const s = Math.max(dayNum(f.start), r);
    const e = Math.min(f.end ? dayNum(f.end) : t, t);
    if (!isNaN(s) && !isNaN(e) && e > s) frozen += e - s;
  }
  const total = t - r;
  return { total, frozen, adjusted: Math.max(0, total - frozen) };
}
const isFrozen = (bag) => { const f = (bag.freezes || []).at(-1); return !!(f && f.start && !f.end); };
const ratio = (b) => (b.dose > 0 && b.waterG > 0 ? b.waterG / b.dose : null);
const ratioStr = (r) => (r ? "1:" + round(r, 1) : "");
const numGrind = (g) => (/^\s*-?\d+(\.\d+)?\s*$/.test(String(g ?? "")) ? Number(g) : null);
const fToC = (f) => (f - 32) * 5 / 9;
const cToF = (c) => c * 9 / 5 + 32;
function tempDisp(f) { if (!isNum(f)) return null; return settings().tempUnit === "C" ? round(fToC(f) * 2) / 2 : round(f, 1); }
function tempStr(f) { const v = tempDisp(f); return v == null ? "" : `${v}°${settings().tempUnit}`; }
function bagName(bag) { if (!bag) return "Deleted bag"; return [bag.beans || "Untitled beans", bag.roaster].filter(Boolean).join(", "); }

function tasteText(t) {
  if (!t) return "";
  const xs = t.x < -0.6 ? "Very sour" : t.x < -0.25 ? "Sour" : t.x > 0.6 ? "Very bitter" : t.x > 0.25 ? "Bitter" : "";
  const ys = t.y < -0.6 ? "very weak" : t.y < -0.25 ? "weak" : t.y > 0.6 ? "very strong" : t.y > 0.25 ? "strong" : "";
  if (!xs && !ys) return "Balanced";
  if (!xs) return ys[0].toUpperCase() + ys.slice(1);
  return ys ? `${xs} and ${ys}` : xs;
}

// =====================================================================
// Advice engine
// =====================================================================
function grindHint(b, dir, big) {
  const g = numGrind(b.grind);
  if (g == null) return "";
  const isInt = Number.isInteger(g);
  const step = isInt ? (g >= 10 ? (big ? 3 : 2) : 1) : (big ? 0.5 : 0.2);
  const sign = (dir === "finer") === settings().finerIsLower ? -1 : 1;
  return ` (try ${round(g + sign * step, isInt ? 0 : 1)})`;
}
function ratioTip(b, dir, big) {
  const r = ratio(b);
  const delta = big ? 1.5 : 1;
  if (dir === "tighter") {
    if (!r) return { text: "Use more coffee for the same amount of water.", why: "A weak or thin cup usually means too little coffee for the water." };
    const dose = round(b.waterG / Math.max(12, r - delta) * 2) / 2;
    return { text: `Use more coffee: ${dose} g for the same ${b.waterG} g of water (${ratioStr(b.waterG / dose)}).`, why: "A weak or thin cup usually means too little coffee for the water." };
  }
  if (!r) return { text: "Use more water for the same amount of coffee.", why: "A heavy, intense cup is more concentrated than it needs to be." };
  const water = round(b.dose * Math.min(20, r + delta) / 5) * 5;
  return { text: `Use more water: ${water} g for the same ${b.dose} g of coffee (${ratioStr(water / b.dose)}).`, why: "A heavy, intense cup is more concentrated than it needs to be." };
}

function advise(b) {
  const bag = S.records[b.bagId];
  const roast = (bag?.roastType || "").toLowerCase();
  const d = bag ? daysOff(bag, b.date) : null;
  const out = { lead: null, also: [], notes: [], best: null };
  const t = b.taste;

  if (!t) {
    out.lead = { text: "Place this cup on the taste compass to get a dial-in tip.", why: "Edit the brew and tap where it landed between sour and bitter, weak and strong." };
  } else {
    const ax = Math.abs(t.x), ay = Math.abs(t.y);
    const ext = t.x < -0.25 ? "under" : t.x > 0.25 ? "over" : null;
    const str = t.y < -0.25 ? "weak" : t.y > 0.25 ? "strong" : null;
    const extTips = [], strTips = [];

    if (ext === "under") {
      extTips.push({ text: `Grind finer${grindHint(b, "finer", ax > 0.6)}.`, why: "Sour usually means the water pulled out too little. A finer grind extracts more." });
      if (isNum(b.tempF) && b.tempF < 203) extTips.push({ text: `Brew hotter, around ${tempStr(Math.min(b.tempF + 5, 208))}.`, why: "Hotter water extracts faster, which lighter roasts especially need." });
      else if (!isNum(b.tempF) && roast.includes("light")) extTips.push({ text: `Use water just off the boil (${tempStr(205)} or hotter).`, why: "Light roasts are dense and need heat to extract." });
      if (isNum(b.timeS) && b.timeS < 150) extTips.push({ text: `Slow the drawdown. This one finished in ${mmss(b.timeS)}.`, why: "A fast brew doesn't give the water enough contact time." });
      if (ax > 0.6) extTips.push({ text: "Add agitation: swirl after the bloom and after the last pour.", why: "Stirring the bed evens out and boosts extraction." });
    }
    if (ext === "over") {
      extTips.push({ text: `Grind coarser${grindHint(b, "coarser", ax > 0.6)}.`, why: "Bitter or drying usually means the water pulled out too much. A coarser grind extracts less." });
      if (isNum(b.tempF) && b.tempF > 198 && (ax > 0.6 || roast.includes("dark"))) extTips.push({ text: `Brew cooler, around ${tempStr(Math.max(b.tempF - 5, 190))}.`, why: "Darker roasts extract easily and turn harsh with very hot water." });
      if (isNum(b.timeS) && b.timeS > 240) extTips.push({ text: `Shorten the brew. This one ran ${mmss(b.timeS)}.`, why: "A long drawdown usually means the grind is too fine or the bed clogged." });
      if (isNum(b.pours) && b.pours > 4) extTips.push({ text: "Use fewer pours.", why: "Each pour adds agitation and extraction." });
    }
    if (str === "weak") strTips.push(ratioTip(b, "tighter", ay > 0.6));
    if (str === "strong") strTips.push(ratioTip(b, "looser", ay > 0.6));

    const tips = ax >= ay ? [...extTips, ...strTips] : [...strTips, ...extTips];
    if (tips.length) {
      out.lead = tips[0];
      out.also = tips.slice(1, 4);
    } else if (isNum(b.rating) && b.rating >= 8) {
      out.lead = { text: "Dialed in. Keep this recipe.", why: "To explore from here, change one thing at a time so you know what made the difference." };
    } else if (isNum(b.rating) && b.rating <= 5) {
      out.lead = { text: "The balance is right, so look past the recipe.", why: "A balanced but dull cup usually comes down to the beans or the water." };
    } else {
      out.lead = { text: "Close. Make one small change and compare.", why: "Try a slightly finer grind to see if it gets sweeter. If it turns bitter, go back." };
    }
    if (ext === "over" && str === "weak") out.notes.push("Bitter and weak together often means channeling: water finding a fast path through the bed. Pour gently and keep the bed flat.");
  }

  if (d) {
    if (d.adjusted < 5) out.notes.push(`These beans are only ${d.adjusted} day${d.adjusted === 1 ? "" : "s"} off roast. Very fresh coffee is still releasing gas, which can taste sharp or muted. A longer bloom (45–60 s) helps.`);
    else if (d.adjusted > 35) out.notes.push(`These beans are ${d.adjusted} days off roast${d.frozen ? " (not counting time frozen)" : ""}. Flavor fades after about 4–5 weeks, so they may taste flat whatever the recipe.`);
  }
  if (/distill/i.test(b.waterType || "") && !/mineral/i.test(b.waterType || "")) out.notes.push("Plain distilled water has none of the minerals that pull flavor out of coffee. Add minerals or use filtered water.");

  const others = brews().filter((x) => x.bagId === b.bagId && x.id !== b.id && isNum(x.rating));
  if (others.length) {
    const best = others.reduce((a, x) => (x.rating > a.rating || (x.rating === a.rating && x.date > a.date) ? x : a));
    if (!isNum(b.rating) || best.rating > b.rating) out.best = best;
  }
  return out;
}

// =====================================================================
// Sync
// =====================================================================
let syncTimer = null, syncing = false, syncAgain = false, healTries = 0;
function scheduleSync(ms = 1200) { clearTimeout(syncTimer); syncTimer = setTimeout(sync, ms); }
// Google Sign-In. The ID token goes to /api/session once; after that the
// session cookie does the work, so this sheet only appears when signed out.
let gisReady = null;
function loadGIS() {
  return (gisReady ||= new Promise((res, rej) => {
    const el = document.createElement("script");
    el.src = "https://accounts.google.com/gsi/client";
    el.async = true;
    el.onload = res;
    el.onerror = () => rej(new Error("Couldn't reach Google. Check your connection or any content blocker."));
    document.head.appendChild(el);
  }));
}
function openSignIn() {
  openSheet(`
    <div class="sheet-head"><h1>Sign in</h1><button class="iconbtn" data-close type="button" aria-label="Close">\u2715</button></div>
    <p class="muted">Sign in with Google to keep your brews on every device. Anything logged on this device already is kept and uploaded once you're in.</p>
    <div id="gbtn" style="margin:16px 0;display:flex;justify-content:center;min-height:44px"></div>
    <p class="muted small" id="gerr" role="alert"></p>

    const fail = (m) => { const e = $("#gerr", root); if (e) e.textContent = m; };

      if (!cfg.clientId) return fail("Sign-in isn't set up on the server yet.");
      await loadGIS();
      google.accounts.id.initialize({
        client_id: cfg.clientId,
        callback: async (resp) => {
          try {
            const r = await fetch("/api/session", {
              method: "POST", headers: { "content-type": "application/json" },
              body: JSON.stringify({ credential: resp.credential }), credentials: "same-origin",
            });
            if (!r.ok) return fail(((await r.json().catch(() => ({}))).error) || "That didn't work. Try again.");
            closeSheet();
            S.verified = false; // makes the next sync adopt the account and merge local brews
            healTries = 0;
            sync();
          } catch { fail("Couldn't reach the server. Try again."); }
        },
      });
      google.accounts.id.renderButton($("#gbtn", root), { theme: "outline", size: "large", text: "signin_with" });

}
async function signOut() {
  try { await fetch("/api/signout", { method: "POST", credentials: "same-origin" }); } catch {}
  try { if (typeof google !== "undefined") google.accounts.id.disableAutoSelect(); } catch {}

}
function setStatus(s) {
  S.status = s;
  const el = $("#status");
  el.dataset.s = s;
  const label = {
    idle: "Loading", saving: "Saving", synced: "Synced", offline: "Offline, saved on this device",
    signin: "Sign in to sync", error: "Sync error", local: LS.ok ? "Saved on this device only" : "Preview, not saved",
  }[s] || s;
  el.setAttribute("aria-label", label);
  el.title = label;
  // A coloured dot for the quiet states; a real icon when it wants attention.
  const svg = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
  el.innerHTML = {
    signin: svg('<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l-5-5 5-5"/><path d="M15 12H5"/>'),
    offline: svg('<path d="M3 3l18 18"/><path d="M8.5 8.5A5 5 0 0 0 7 18h9a4 4 0 0 0 1.5-7.7"/><path d="M12 7a5 5 0 0 1 5 4"/>'),
    error: svg('<circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><path d="M12 16h.01"/>'),
  }[s] || "<i></i>";
}

async function sync() {
  if (syncing) { syncAgain = true; return; }
  syncing = true;
  if (S.pending.size) setStatus("saving");
  const sent = {};
  const changes = [];
  if (S.verified) {
    for (const id of [...S.pending].slice(0, 500)) {
      const r = S.records[id];
      if (r) { changes.push(r); sent[id] = r.updatedAt; } else S.pending.delete(id);
    }
  }
  try {
    const res = await fetch("/api/sync", {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ changes }),
      redirect: "manual", credentials: "same-origin", cache: "no-store",
    });
    if (res.type === "opaqueredirect" || res.status === 401 || res.status === 403) { setStatus("signin"); return; }
    if (res.status === 404 || res.status === 405 || !(res.headers.get("content-type") || "").includes("json")) { setStatus("local"); return; } // no sync server here (preview or plain file host)
    if (!res.ok) {
      let msg = ""; try { msg = (await res.json()).error; } catch {}
      setStatus("error"); if (msg) console.warn("Sync:", msg); return;
    }
    const data = await res.json();

    if (!S.verified || data.email !== S.email) {
      const wasLocal = !S.email;
      const prev = { records: S.records };
      if (data.email !== S.email) loadStore(data.email);
      LS.set("brewlog:lastEmail", data.email);
      if (wasLocal) {
        for (const [id, r] of Object.entries(prev.records)) {
          const cur = S.records[id];
          if (!cur || r.updatedAt > cur.updatedAt) { S.records[id] = r; S.pending.add(id); }
        }
        LS.remove(storeKey(null));
      }
      S.verified = true;
      syncAgain = true;
    }

    const server = {};
    let changed = false;
    for (const r of data.records || []) {
      server[r.id] = r;
      const cur = S.records[r.id];
      if (!cur || r.updatedAt > cur.updatedAt) { S.records[r.id] = r; changed = true; }
    }
    for (const id of Object.keys(sent)) if (server[id] && server[id].updatedAt >= S.records[id].updatedAt) S.pending.delete(id);
    for (const id of data.rejected || []) S.pending.delete(id);
    // Self-heal: anything this device has that the server lacks gets re-sent.
    const missing = Object.keys(S.records).filter((id) => !server[id] && !S.pending.has(id));
    if (missing.length && healTries < 3) { healTries++; missing.forEach((id) => S.pending.add(id)); }

    persist();
    setStatus(S.pending.size ? "saving" : "synced");
    if (changed) softRender();
    if (S.pending.size) syncAgain = true;
  } catch (e) {
    setStatus(!LS.ok || !/^https?:$/.test(location.protocol) ? "local" : "offline");
  } finally {
    syncing = false;
    if (syncAgain && S.status !== "offline" && S.status !== "error") { syncAgain = false; scheduleSync(400); }
    else syncAgain = false;
  }
}

    <section class="panel"><h2>How it tasted</h2>
      <div class="taste">
        <div>
          <div class="compass" id="compass" tabindex="0" role="application" aria-label="Taste compass. Use arrow keys: left is sour, right is bitter, up is strong, down is weak.">
            <div class="zone"></div>
            <span class="ax t">Strong</span><span class="ax b">Weak</span><span class="ax l">Sour</span><span class="ax r">Bitter</span>
            <div class="dot" id="dot" hidden></div>

        </div>

          <div class="f"><span>Rating</span>
            <div class="rate" id="rate">${Array.from({ length: 10 }, (_, i) => `<button type="button" data-r="${i + 1}" aria-pressed="${d.rating === i + 1}">${i + 1}</button>`).join("")}</div>
            <div class="rate-ends"><span>Undrinkable</span><span>Best ever</span></div>
          </div>
          <label class="f" style="margin-top:14px"><span>Tasting notes</span><textarea data-k="notes" placeholder="Bright, a little thin, lemony">${v(d.notes)}</textarea></label>
        </div>
      </div>
    </section>

    <div class="actions">
      <button class="btn primary" type="button" id="saveBrew">${editing ? "Save changes" : "Save brew"}</button>
      ${editing ? `<button class="btn" type="button" data-go="brew/${editing.id}">Cancel</button>` : ""}
    </div>
    ${datalists()}
  </div>`;

  const form = $("#brewForm");
  const field = (k) => form.querySelector(`[data-k="${k}"]`);
  const updRatio = () => { const r = ratio({ dose: num(field("dose").value), waterG: num(field("waterG").value) }); $("#ratioOut").textContent = r ? ratioStr(r) : "–"; };
  updRatio();

  const updRoast = () => {
    const bag = S.records[field("bagId").value];
    const el = $("#roastInfo");
    if (!bag) { el.innerHTML = ""; return; }
    const dd = daysOff(bag, field("date").value);
    let h = dd ? `<span class="chip">${dd.adjusted} day${dd.adjusted === 1 ? "" : "s"} off roast</span>` : `<span>Add a roast date to track freshness</span>`;
    if (dd && dd.frozen) h += `<span>${dd.total} since roast, ${dd.frozen} frozen</span>`;
    if (bag.roastType) h += `<span>${esc(bag.roastType)} roast</span>`;
    if (isFrozen(bag)) h += `<span class="chip frozen">Frozen</span><button type="button" class="btn sm" id="thawNow">Mark thawed today</button>`;
    el.innerHTML = h;
    const tb = $("#thawNow");
    if (tb) tb.onclick = () => { thaw(bag); updRoast(); };
  };
  updRoast();

  form.addEventListener("input", (e) => {
    if (e.target.dataset.r !== undefined) FORM.dirty = true;
    if (["dose", "waterG"].includes(e.target.dataset.k)) updRatio();
    if (e.target.dataset.k === "date") updRoast();
  });
  const timeIn = field("time");
  timeIn.addEventListener("input", () => {
    const masked = maskTime(timeIn.value);
    if (masked === timeIn.value) return;
    timeIn.value = masked;
    try { timeIn.setSelectionRange(masked.length, masked.length); } catch {} // caret stays at the end
  });
  timeIn.addEventListener("blur", () => { timeIn.value = normTime(timeIn.value); });

  field("bagId").addEventListener("change", (e) => {
    if (e.target.value === "__new") {
      const prevBag = FORM.d.bagId;
      e.target.value = prevBag;
      openBagSheet(null, (bag) => { field("bagId").innerHTML = bagOptions(bag.id); FORM.d.bagId = bag.id; updRoast(); });
      return;
    }
    FORM.d.bagId = e.target.value;
    if (!FORM.editing && !FORM.dirty) {
      const nd = draftFrom(null, e.target.value);
      ["grinder", "grind", "waterType", "brewer", "dose", "waterG", "bloomG", "bloomS", "method", "pours"].forEach((k) => (field(k).value = nd[k] ?? ""));
      field("temp").value = tempDisp(nd.tempF) ?? "";
      updRatio();
    }
    updRoast();
  });

  $$("[data-step]", form).forEach((btn) => btn.addEventListener("click", () => {
    const k = btn.dataset.step, dir = Number(btn.dataset.dir);
    const inp = field(k);
    const cur = num(inp.value);
    if (k === "grind" && cur == null && inp.value.trim()) return;
    const step = k === "temp" ? (settings().tempUnit === "C" ? 0.5 : 1) : (cur != null && !Number.isInteger(cur) ? 0.1 : 1);
    const base = cur ?? (k === "temp" ? (settings().tempUnit === "C" ? 94 : 200) : 0);
    inp.value = round(base + dir * step, step < 1 ? 1 : 0);
    FORM.dirty = true;
  }));

  // rating
  $("#rate").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const r = Number(b.dataset.r);
    FORM.d.rating = FORM.d.rating === r ? null : r;
    $$("#rate button").forEach((x) => x.setAttribute("aria-pressed", String(Number(x.dataset.r) === FORM.d.rating)));
  });

  bindCompass();

  $("#saveBrew").addEventListener("click", () => {
    const bagId = field("bagId").value;
    if (!S.records[bagId]) { toast("Pick a bag first."); return; }
    const tIn = num(field("temp").value);
    const rec = {
      ...(editing || {}),
      id: editing ? editing.id : uid(), type: "brew", createdAt: editing?.createdAt || Date.now(),
      date: field("date").value || today(), bagId,
      grinder: field("grinder").value.trim(), grind: field("grind").value.trim(),
      tempF: tIn == null ? null : round(settings().tempUnit === "C" ? cToF(tIn) : tIn, 1),
      waterType: field("waterType").value.trim(), brewer: field("brewer").value.trim(),
      dose: num(field("dose").value), waterG: num(field("waterG").value),
      bloomG: num(field("bloomG").value), bloomS: num(field("bloomS").value),
      pours: num(field("pours").value), timeS: parseTime(normTime(field("time").value)),
      method: field("method").value.trim(), rating: FORM.d.rating, taste: FORM.d.taste,
      notes: field("notes").value.trim(),
    };
    put(rec);
    FORM = null;
    go("brew/" + rec.id);
  });
}

function bindCompass() {
  const el = $("#compass"), dot = $("#dot"), label = $("#tasteLabel");
  const show = () => {
    const t = FORM.d.taste;
    if (!t) { dot.hidden = true; label.textContent = "Tap where this cup landed"; return; }
    dot.hidden = false;
    dot.style.left = ((t.x + 1) / 2) * 100 + "%";
    dot.style.top = ((1 - t.y) / 2) * 100 + "%";
    label.innerHTML = `${esc(tasteText(t))}<button type="button" id="clearTaste">Clear</button>`;
    $("#clearTaste").onclick = () => { FORM.d.taste = null; show(); };
  };
  const set = (x, y) => { FORM.d.taste = { x: round(clamp(x, -1, 1) * 20) / 20, y: round(clamp(y, -1, 1) * 20) / 20 }; show(); };
  const place = (e) => { const r = el.getBoundingClientRect(); set(((e.clientX - r.left) / r.width) * 2 - 1, -(((e.clientY - r.top) / r.height) * 2 - 1)); };
  el.addEventListener("pointerdown", (e) => { el.setPointerCapture(e.pointerId); place(e); });
  el.addEventListener("pointermove", (e) => { if (el.hasPointerCapture(e.pointerId)) place(e); });
  el.addEventListener("keydown", (e) => {
    const m = { ArrowLeft: [-0.1, 0], ArrowRight: [0.1, 0], ArrowUp: [0, 0.1], ArrowDown: [0, -0.1] }[e.key];
    if (!m) return;
    e.preventDefault();
    const t = FORM.d.taste || { x: 0, y: 0 };
    set(t.x + m[0], t.y + m[1]);
  });
  show();
}

// =====================================================================
// Bags
// =====================================================================
function freeze(bag) { put({ ...bag, freezes: [...(bag.freezes || []), { start: today(), end: null }] }); toast("Frozen. The roast clock is paused."); }
function thaw(bag) { const f = [...(bag.freezes || [])]; if (!f.length) return; f[f.length - 1] = { ...f.at(-1), end: today() }; put({ ...bag, freezes: f }); toast("Thawed. The roast clock is running again."); }

function viewBags() {
  const act = activeBags();
  const done = allBags().filter((b) => b.finished).sort(byRoastDesc);
  const card = (bag) => {
    const dd = daysOff(bag);
    const n = brews().filter((b) => b.bagId === bag.id).length;
    return `<section class="panel bag">
      <div><div class="t1">${esc(bag.beans || "Untitled beans")}</div>
      <div class="muted small">${esc([bag.roaster, bag.roastType && bag.roastType + " roast", bag.roastDate && "roasted " + fmtDate(bag.roastDate)].filter(Boolean).join(", "))}</div></div>
      <div class="roastinfo" style="margin:0">
        ${dd ? `<span class="chip">${dd.adjusted} day${dd.adjusted === 1 ? "" : "s"} off roast</span>` : ""}
        ${dd && dd.frozen ? `<span>${dd.total} since roast, ${dd.frozen} frozen</span>` : ""}
        ${isFrozen(bag) ? `<span class="chip frozen">Frozen since ${fmtDate(bag.freezes.at(-1).start)}</span>` : ""}
        <span>${n} brew${n === 1 ? "" : "s"}</span>
      </div>
      ${bag.notes ? `<p class="small muted">${esc(bag.notes)}</p>` : ""}
      <div class="btns">
        ${bag.finished ? "" : isFrozen(bag) ? `<button class="btn sm" data-act="thaw" data-id="${bag.id}" type="button">Thaw</button>` : `<button class="btn sm" data-act="freeze" data-id="${bag.id}" type="button">Freeze</button>`}
        <button class="btn sm" data-act="edit" data-id="${bag.id}" type="button">Edit</button>
        <button class="btn sm" data-act="finish" data-id="${bag.id}" type="button">${bag.finished ? "Move back to active" : "Mark finished"}</button>
      </div></section>`;
  };
  main.innerHTML = `
    <div class="pagehead"><h1>Bags</h1><button class="btn primary sm" id="addBag" type="button">Add bag</button></div>
    ${act.length ? act.map(card).join("") : `<div class="empty"><p>No active bags. Add the one you're brewing now.</p></div>`}
    ${done.length ? `<details><summary>Finished bags (${done.length})</summary>${done.map(card).join("")}</details>` : ""}`;
  $("#addBag").onclick = () => openBagSheet(null, () => viewBags());
  main.onclick = (e) => {
    const btn = e.target.closest("[data-act]"); if (!btn || ROUTE !== "bags") return;
    const bag = S.records[btn.dataset.id];
    const act = btn.dataset.act;
    if (act === "freeze") freeze(bag);
    if (act === "thaw") thaw(bag);
    if (act === "finish") put({ ...bag, finished: !bag.finished });
    if (act === "edit") return openBagSheet(bag, () => viewBags());
    viewBags();
  };
}

function openBagSheet(bag, done) {
  const isNew = !bag;
  const d = bag ? structuredClone(bag) : { id: uid(), type: "bag", createdAt: Date.now(), roaster: "", beans: "", roastType: "", roastDate: "", notes: "", freezes: [], finished: false };
  const fr = () => (d.freezes || []).map((f, i) => `<div class="freeze">
      <label class="f"><span>Frozen</span><input type="date" data-fi="${i}" data-fk="start" value="${esc(f.start || "")}"></label>
      <label class="f"><span>Thawed</span><input type="date" data-fi="${i}" data-fk="end" value="${esc(f.end || "")}"></label>
      <button class="btn" type="button" data-rm="${i}" aria-label="Remove this freezer period">×</button></div>`).join("");
  openSheet(`
    <div class="sheet-head"><h1>${isNew ? "Add a bag" : "Edit bag"}</h1><button class="iconbtn" data-close type="button" aria-label="Close">✕</button></div>
    <div id="bagForm">
      <div class="grid">
        <label class="f wide"><span>Beans</span><input name="beans" value="${esc(d.beans)}" placeholder="Ethiopia Guji Hambela" required></label>
        <label class="f wide"><span>Roaster</span><input name="roaster" value="${esc(d.roaster)}" placeholder="Sey"></label>
        <label class="f"><span>Roast type</span><select name="roastType"><option value="">Choose</option>${ROAST_TYPES.map((r) => `<option ${r === d.roastType ? "selected" : ""}>${r}</option>`).join("")}${d.roastType && !ROAST_TYPES.includes(d.roastType) ? `<option selected>${esc(d.roastType)}</option>` : ""}</select></label>
        <label class="f"><span>Roast date</span><input type="date" name="roastDate" value="${esc(d.roastDate)}"></label>
        <label class="f wide"><span>Notes on bag</span><input name="notes" value="${esc(d.notes)}" placeholder="Peach, jasmine, bergamot"></label>
      </div>
      <h2 style="margin-top:20px">Freezer</h2>
      <p class="muted small" style="margin-bottom:10px">Days in the freezer don't count toward days off roast. Leave "Thawed" empty while it's still frozen.</p>
      <div class="freezes" id="freezes">${fr()}</div>
      <button class="btn sm" type="button" id="addFreeze" style="margin-top:8px">Add freezer period</button>
      <div class="actions">
        <button class="btn primary" type="button" id="saveBag">${isNew ? "Add bag" : "Save bag"}</button>
        ${isNew ? "" : `<button class="btn danger" type="button" id="delBag">Delete bag</button>`}
      </div>
    </div>`, (root) => {
    const form = $("#bagForm", root);
    const redraw = () => ($("#freezes", root).innerHTML = fr());
    $("#addFreeze", root).onclick = () => { d.freezes = [...(d.freezes || []), { start: today(), end: null }]; redraw(); };
    $("#freezes", root).addEventListener("input", (e) => { const i = e.target.dataset.fi; if (i == null) return; d.freezes[i][e.target.dataset.fk] = e.target.value || null; });
    $("#freezes", root).addEventListener("click", (e) => { const i = e.target.dataset.rm; if (i == null) return; d.freezes.splice(Number(i), 1); redraw(); });
    $("#saveBag", root).onclick = () => {
      const val = (n) => String(form.querySelector(`[name="${n}"]`)?.value || "").trim();
      if (!val("beans")) { toast("Add the beans' name."); form.querySelector('[name="beans"]').focus(); return; }
      for (const k of ["beans", "roaster", "roastType", "roastDate", "notes"]) d[k] = val(k);
      d.freezes = (d.freezes || []).filter((f) => f.start).sort((a, b) => a.start.localeCompare(b.start));
      if (d.freezes.some((f) => f.end && f.end < f.start)) { toast("A thaw date is before its freeze date."); return; }
      put(d);
      closeSheet();
      done && done(d);
    };
    const del = $("#delBag", root);
    if (del) del.onclick = (e) => {
      const bb = brews().filter((b) => b.bagId === d.id);
      if (!armed(e.currentTarget, bb.length ? `Tap again: deletes ${bb.length} brew${bb.length === 1 ? "" : "s"} too` : "Tap again to delete")) return;
      putRecords([{ ...bag, deleted: true }, ...bb.map((b) => ({ ...b, deleted: true }))]);
      closeSheet();
      done && done(null);
    };
  });
}

// =====================================================================
// Insights
// =====================================================================
function factorDefs() {
  const lowerFiner = settings().finerIsLower;
  const bagMeans = {};
  for (const b of brews()) { const g = numGrind(b.grind); if (g == null) continue; (bagMeans[b.bagId] ||= []).push(g); }
  for (const k in bagMeans) bagMeans[k] = bagMeans[k].reduce((a, x) => a + x, 0) / bagMeans[k].length;
  const side = (v) => (Math.abs(v) < 0.05 ? "usual" : (lowerFiner ? v < 0 : v > 0) ? "finer" : "coarser");
  const rel = (v) => (side(v) === "usual" ? "usual setting" : `${round(Math.abs(v), 1)} ${side(v)}`);
  const relRange = (lo, hi) => {
    if (side(lo) === side(hi) && side(lo) !== "usual") { const a = [round(Math.abs(lo), 1), round(Math.abs(hi), 1)].sort((x, y) => x - y); return `${a[0] === a[1] ? a[0] : a[0] + " to " + a[1]} ${side(lo)} than usual`; }
    return `${rel(lo)} to ${rel(hi)}`;
  };
  const unitRange = (u, d = 0) => (lo, hi) => (round(lo, d) === round(hi, d) ? `${round(lo, d)} ${u}` : `${round(lo, d)} to ${round(hi, d)} ${u}`);
  return [
    { k: "days", name: "Days off roast", get: (b) => { const g = S.records[b.bagId]; return g ? daysOff(g, b.date)?.adjusted : null; }, fmt: (v) => `${Math.round(v)} days`, range: unitRange("days") },
    { k: "temp", name: "Temperature", get: (b) => b.tempF, fmt: (v) => tempStr(v) },
    { k: "ratio", name: "Ratio", get: ratio, fmt: (v) => ratioStr(v) },
    { k: "grind", name: "Grind vs. that bag's usual", get: (b) => { const g = numGrind(b.grind); return g == null || bagMeans[b.bagId] == null ? null : g - bagMeans[b.bagId]; }, fmt: rel, range: relRange },
    { k: "time", name: "Brew time", get: (b) => b.timeS, fmt: mmss },
    { k: "bloomS", name: "Bloom time", get: (b) => b.bloomS, fmt: (v) => `${Math.round(v)} s`, range: unitRange("s") },
    { k: "pours", name: "Pours", get: (b) => b.pours, fmt: (v) => `${round(v, 1)}` },
    { k: "dose", name: "Coffee dose", get: (b) => b.dose, fmt: (v) => `${round(v, 1)} g`, range: unitRange("g", 1) },
  ];
}
const catDefs = [
  { k: "brewer", name: "Brewer", get: (b) => b.brewer },
  { k: "waterType", name: "Type of water", get: (b) => b.waterType },
  { k: "grinder", name: "Grinder", get: (b) => b.grinder },
  { k: "roastType", name: "Roast type", get: (b) => S.records[b.bagId]?.roastType },
];
const mean = (a) => a.reduce((s, x) => s + x, 0) / a.length;

function analyse(rated) {
  const rows = [];
  for (const f of factorDefs()) {
    const pts = rated.map((b) => ({ v: f.get(b), r: b.rating })).filter((p) => isNum(p.v)).sort((a, b) => a.v - b.v);
    const distinct = [...new Set(pts.map((p) => p.v))];
    if (pts.length < 6 || distinct.length < 2) continue;
    let groups;
    if (distinct.length <= 3) groups = distinct.map((v) => pts.filter((p) => p.v === v));
    else { const n = pts.length; groups = [pts.slice(0, Math.round(n / 3)), pts.slice(Math.round(n / 3), Math.round((2 * n) / 3)), pts.slice(Math.round((2 * n) / 3))]; }
    groups = groups.filter((g) => g.length >= 2).map((g) => ({ lo: g[0].v, hi: g.at(-1).v, m: mean(g.map((p) => p.r)), n: g.length }));
    if (groups.length < 2) continue;
    const best = groups.reduce((a, g) => (g.m > a.m ? g : a)), worst = groups.reduce((a, g) => (g.m < a.m ? g : a));
    const range = (g) => (f.range ? f.range(g.lo, g.hi) : f.fmt(g.lo) === f.fmt(g.hi) ? f.fmt(g.lo) : `${f.fmt(g.lo)} to ${f.fmt(g.hi)}`);
    rows.push({ name: f.name, spread: best.m - worst.m, n: pts.length, text: `Best around ${range(best)} (avg ${round(best.m, 1)}), vs ${round(worst.m, 1)} at ${range(worst)}.` });
  }
  for (const c of catDefs) {
    const by = {};
    for (const b of rated) { const v = (c.get(b) || "").trim(); if (v) (by[v] ||= []).push(b.rating); }
    const groups = Object.entries(by).filter(([, a]) => a.length >= 2).map(([v, a]) => ({ v, m: mean(a), n: a.length }));
    if (groups.length < 2) continue;
    const best = groups.reduce((a, g) => (g.m > a.m ? g : a)), worst = groups.reduce((a, g) => (g.m < a.m ? g : a));
    rows.push({ name: c.name, spread: best.m - worst.m, n: groups.reduce((s, g) => s + g.n, 0), text: `${best.v} scores best (avg ${round(best.m, 1)}), ${worst.v} lowest (avg ${round(worst.m, 1)}).` });
  }
  return rows.sort((a, b) => b.spread - a.spread);
}

let insightFactor = "days", insightBag = "all";
function viewInsights() {
  const all = brews();
  const rated = all.filter((b) => isNum(b.rating));
  const need = 5;
  if (rated.length < need) {
    main.innerHTML = `<div class="empty"><h1>Insights need a few more cups</h1><p>Rate ${need - rated.length} more brew${need - rated.length === 1 ? "" : "s"} and this page will start showing which factors move your ratings.</p><button class="btn primary" type="button" data-go="log">Log a brew</button></div>${tasteMap(all)}`;
    return;
  }
  const last10 = rated.slice(0, 10);
  const byBag = {};
  rated.forEach((b) => (byBag[b.bagId] ||= []).push(b.rating));
  const topBag = Object.entries(byBag).filter(([, a]) => a.length >= 2).map(([id, a]) => ({ id, m: mean(a) })).sort((a, b) => b.m - a.m)[0];
  const rows = analyse(rated);
  const maxSpread = Math.max(3, ...rows.map((r) => r.spread));
  const defs = factorDefs();
  if (!defs.some((f) => f.k === insightFactor)) insightFactor = "days";
  const f = defs.find((x) => x.k === insightFactor);
  const bagsUsed = [...new Set(rated.map((b) => b.bagId))].map((id) => S.records[id]).filter(Boolean);
  const pts = rated.filter((b) => insightBag === "all" || b.bagId === insightBag).map((b) => ({ x: f.get(b), y: b.rating })).filter((p) => isNum(p.x));

  main.innerHTML = `
    <h1>Insights</h1>
    <div class="metrics">
      <div class="metric"><b>${all.length}</b><span>brews logged</span></div>
      <div class="metric"><b>${round(mean(last10.map((b) => b.rating)), 1)}</b><span>average, last ${last10.length}</span></div>
      <div class="metric"><b style="font-size:15px;line-height:1.3">${topBag ? esc(S.records[topBag.id]?.beans || "–") : "–"}</b><span>${topBag ? `top bag, avg ${round(topBag.m, 1)}` : "top bag"}</span></div>
    </div>

    <section class="panel"><h2>What's making the difference</h2>
      ${rows.length ? rows.map((r) => `<div class="factor"><div class="fh">${esc(r.name)}<span>${r.spread >= 2 ? "Big difference" : r.spread >= 1 ? "Some difference" : "Little difference so far"}</span></div>
        <p>${esc(r.text)}</p><div class="bar"><i style="width:${clamp((r.spread / maxSpread) * 100, 3, 100)}%"></i></div></div>`).join("")
        : `<p class="muted">Fill in more recipe details (temperature, ratio, grind) and vary them a little to see what matters.</p>`}
      <p class="muted small" style="margin-top:12px">Based on ${rated.length} rated brews. Each factor splits your brews into low, middle, and high groups and compares their average rating. It gets more reliable as you log more.</p>
    </section>

    <section class="panel"><h2>Rating vs. a factor</h2>
      <div class="grid" style="margin-bottom:12px">
        <select id="iFactor" aria-label="Factor">${defs.map((x) => `<option value="${x.k}" ${x.k === insightFactor ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select>
        <select id="iBag" aria-label="Bag"><option value="all">All bags</option>${bagsUsed.map((g) => `<option value="${g.id}" ${g.id === insightBag ? "selected" : ""}>${esc(bagName(g))}</option>`).join("")}</select>
      </div>
      ${pts.length >= 2 ? scatter(pts, f.fmt) : `<p class="muted">Not enough brews with this detail yet.</p>`}
    </section>

  $("#iFactor").onchange = (e) => { insightFactor = e.target.value; viewInsights(); };
  $("#iBag").onchange = (e) => { insightBag = e.target.value; viewInsights(); };
}

function scatter(pts, fmt) {
  const W = clamp(Math.round(main.clientWidth - 34), 280, 640), H = Math.round(clamp(W * 0.55, 200, 300)), P = { l: 30, r: 14, t: 10, b: 28 };
  let x0 = Math.min(...pts.map((p) => p.x)), x1 = Math.max(...pts.map((p) => p.x));
  if (x0 === x1) { x0 -= 1; x1 += 1; }
  const padX = (x1 - x0) * 0.06; x0 -= padX; x1 += padX;
  const sx = (v) => P.l + ((v - x0) / (x1 - x0)) * (W - P.l - P.r);
  const sy = (r) => P.t + ((10 - r) / 9) * (H - P.t - P.b);
  const xt = [0, 1, 2, 3].map((i) => x0 + padX + (i * (x1 - x0 - 2 * padX)) / 3);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Scatter chart of rating against the chosen factor">
    ${[1, 4, 7, 10].map((r) => `<line class="grid-l" x1="${P.l}" x2="${W - P.r}" y1="${sy(r)}" y2="${sy(r)}"/><text x="${P.l - 8}" y="${sy(r) + 4}" text-anchor="end">${r}</text>`).join("")}
    ${xt.map((v) => `<text x="${sx(v)}" y="${H - 8}" text-anchor="middle">${esc(fmt(v))}</text>`).join("")}
    ${pts.map((p) => `<circle class="pt" cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="6"/>`).join("")}
  </svg>`;
}

function tasteMap(all) {
  const t = all.filter((b) => b.taste);
  if (t.length < 2) return "";
  const W = 260;
  return `<section class="panel"><h2>Where your cups land</h2>
    <p class="muted small" style="margin-bottom:12px">Darker dots scored higher. A cluster left of center means you tend to under-extract; right of center, over-extract.</p>
    <svg class="chart" viewBox="0 0 ${W} ${W}" style="max-width:300px;margin:0 auto" role="img" aria-label="Taste map of your brews">
      <rect x="0.5" y="0.5" width="${W - 1}" height="${W - 1}" rx="14" fill="none" stroke="var(--line)"/>
      <line class="grid-l" x1="${W / 2}" x2="${W / 2}" y1="0" y2="${W}"/><line class="grid-l" y1="${W / 2}" y2="${W / 2}" x1="0" x2="${W}"/>
      <text x="${W / 2}" y="16" text-anchor="middle">Strong</text><text x="${W / 2}" y="${W - 8}" text-anchor="middle">Weak</text>
      <text x="8" y="${W / 2 - 6}">Sour</text><text x="${W - 8}" y="${W / 2 - 6}" text-anchor="end">Bitter</text>
      ${t.map((b) => `<circle cx="${(((b.taste.x + 1) / 2) * (W - 24) + 12).toFixed(1)}" cy="${(((1 - b.taste.y) / 2) * (W - 24) + 12).toFixed(1)}" r="7" fill="var(--accent)" fill-opacity="${isNum(b.rating) ? (0.15 + 0.85 * (b.rating - 1) / 9).toFixed(2) : 0.12}" stroke="var(--accent)" stroke-opacity=".5"/>`).join("")}
    </svg></section>`;
}

function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = res;
    s.onerror = () => rej(new Error("Couldn't load the spreadsheet tool. Check your connection and try again."));
    document.head.appendChild(s);
  });
}
function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function exportFile(kind) {
  const stamp = today();
  if (kind === "csv") {
    const rows = brewRows();
    const heads = BREW_COLS.map(([h]) => h);
    const cell = (v) => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const csv = [heads.map(cell).join(","), ...rows.map((r) => heads.map((h) => cell(r[h])).join(","))].join("\n");
    download(new Blob(["\ufeff" + csv], { type: "text/csv" }), `dialed-brews-${stamp}.csv`);
    return;
  }
  try {
    await loadXLSX();
    const wb = XLSX.utils.book_new();
    const ws1 = XLSX.utils.json_to_sheet(brewRows(), { header: BREW_COLS.map(([h]) => h) });
    ws1["!cols"] = BREW_COLS.map(([h]) => ({ wch: Math.max(10, h.length + 2) }));
    const ws2 = XLSX.utils.json_to_sheet(bagRows(), { header: BAG_COLS.map(([h]) => h) });
    ws2["!cols"] = BAG_COLS.map(([h]) => ({ wch: Math.max(12, h.length + 2) }));
    XLSX.utils.book_append_sheet(wb, ws1, "Brews");
    XLSX.utils.book_append_sheet(wb, ws2, "Bags");
    XLSX.writeFile(wb, `dialed-log-${stamp}.xlsx`);
  } catch (e) { toast(e.message); }
}

const normKey = (s) => String(s).toLowerCase().replace(/[^a-z0-9]/g, "");
function cellDate(v) {
  if (v instanceof Date && !isNaN(v)) return ymd(new Date(v.getTime() + 12 * 3600e3));
  if (isNum(v) && v > 20000) return ymd(new Date(Date.UTC(1899, 11, 30) + v * 864e5 + 12 * 3600e3));
  const s = String(v ?? "").trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) { const y = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]); return `${y}-${pad2(m[1])}-${pad2(m[2])}`; }
  return "";
}
function cellTime(v) {
  if (v instanceof Date && !isNaN(v)) { const h = v.getHours(), mi = v.getMinutes(), s = v.getSeconds(); return h > 0 && h < 15 && s === 0 ? h * 60 + mi : h * 3600 + mi * 60 + s; }
  if (isNum(v) && v > 0 && v < 1) { const secs = Math.round(v * 86400); return secs >= 3600 && secs % 60 === 0 ? secs / 60 : secs; } // "3:10" typed in Excel is read as 3 h 10 min
  return parseTime(v);
}
const pick = (row, ...keys) => { for (const k of keys) if (row[k] !== undefined && row[k] !== "") return row[k]; return ""; };
const str = (v) => (v instanceof Date ? cellDate(v) : String(v ?? "").trim());

async function importFile(file) {
  try {
    await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: true });
    const brewName = wb.SheetNames.find((n) => normKey(n) === "brews") || wb.SheetNames.find((n) => normKey(n) !== "bags");
    const bagName_ = wb.SheetNames.find((n) => normKey(n) === "bags");
    const rows = (name) => (name ? XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: "", raw: true }) : []).map((r) => { const o = {}; for (const k in r) o[normKey(k)] = r[k]; return o; });
    const out = [];
    const bagsById = Object.fromEntries(allBags().map((g) => [g.id, g]));
    const bagKey = (roaster, beans, rd) => [roaster, beans, rd].map((x) => String(x || "").toLowerCase().trim()).join("|");
    const bagsByKey = Object.fromEntries(allBags().map((g) => [bagKey(g.roaster, g.beans, g.roastDate), g]));
    let nBags = 0, nBrews = 0, nSkipped = 0;

    const normRoast = (v) => { const s = str(v); return ROAST_TYPES.find((r) => normKey(r) === normKey(s)) || s; };
    for (const r of rows(bagName_)) {
      const id = str(pick(r, "bagid"));
      const beans = str(pick(r, "beans")), roaster = str(pick(r, "roaster")), rd = cellDate(pick(r, "roastdate"));
      if (!beans && !roaster) continue;
      const existing = (id && bagsById[id]) || bagsByKey[bagKey(roaster, beans, rd)];
      const freezes = String(pick(r, "freezerperiods") || "").split(";").map((p) => { const d = p.match(/\d{4}-\d{2}-\d{2}/g) || []; return d[0] ? { start: d[0], end: d[1] || null } : null; }).filter(Boolean);
      const bag = { ...(existing || { id: id || uid(), type: "bag", createdAt: Date.now() }), roaster, beans, roastType: normRoast(pick(r, "roasttype")), roastDate: rd, notes: str(pick(r, "notesonbag", "bagnotes")), freezes, finished: /^y/i.test(str(pick(r, "finished"))) };
      bagsById[bag.id] = bag; bagsByKey[bagKey(roaster, beans, rd)] = bag; out.push(bag); nBags++;
    }

    const sig = (b) => [b.date, b.bagId, b.grind, b.rating, b.notes].join("|");
    const sigs = new Set(brews().map(sig));
    const brewsById = Object.fromEntries(brews().map((b) => [b.id, b]));
    for (const r of rows(brewName)) {
      if (!Object.values(r).some((v) => v !== "")) continue;
      const roaster = str(pick(r, "roaster")), beans = str(pick(r, "beans", "bean", "coffee")), rd = cellDate(pick(r, "roastdate"));
      let bag = bagsById[str(pick(r, "bagid"))] || bagsByKey[bagKey(roaster, beans, rd)];
      if (!bag) {
        bag = { id: uid(), type: "bag", createdAt: Date.now(), roaster, beans: beans || "Imported beans", roastType: normRoast(pick(r, "roasttype")), roastDate: rd, notes: str(pick(r, "notesonbag", "bagnotes")), freezes: [], finished: false };
        bagsById[bag.id] = bag; bagsByKey[bagKey(roaster, beans, rd)] = bag; out.push(bag); nBags++;
      }
      let tempF = num(pick(r, "temperaturef", "temperature", "temp", "tempf"));
      const tempC = num(pick(r, "temperaturec", "tempc"));
      if (tempC != null) tempF = cToF(tempC);
      else if (tempF != null && tempF < 110) tempF = cToF(tempF);
      let bloomG = num(pick(r, "bloomg")), bloomS = num(pick(r, "blooms")), method = str(pick(r, "method"));
      const bloomRaw = str(pick(r, "bloom"));
      if (bloomRaw && bloomG == null && bloomS == null) {
        const g = bloomRaw.match(/(\d+(?:\.\d+)?)\s*g/i), s = bloomRaw.match(/(\d+(?:\.\d+)?)\s*(s|sec)/i), all = bloomRaw.match(/\d+(?:\.\d+)?/g) || [];
        if (g || s) { bloomG = g ? Number(g[1]) : null; bloomS = s ? Number(s[1]) : null; }
        else if (all.length >= 2) { bloomG = Number(all[0]); bloomS = Number(all[1]); }
        else method = [`Bloom: ${bloomRaw}`, method].filter(Boolean).join(". ");
      }
      const resRaw = pick(r, "result", "rating", "result110");
      let rating = isNum(resRaw) ? resRaw : num(String(resRaw).match(/\d+(\.\d+)?/)?.[0]);
      let notes = str(pick(r, "tastingnotes", "notes"));
      if (rating != null) rating = clamp(Math.round(rating), 1, 10);
      else if (str(resRaw)) notes = [`Result: ${str(resRaw)}`, notes].filter(Boolean).join(". ");
      const tx = num(pick(r, "sourtobitter")), ty = num(pick(r, "weaktostrong"));
      const id = str(pick(r, "brewid"));
      const prev = id && brewsById[id];
      const brew = {
        ...(prev || {}), id: id || uid(), type: "brew", createdAt: prev?.createdAt || Date.now(),
        date: cellDate(pick(r, "brewdate", "date")) || today(), bagId: bag.id,
        grinder: str(pick(r, "grinder")), grind: str(pick(r, "grindsetting", "grind")),
        tempF: tempF == null ? null : round(tempF, 1), waterType: str(pick(r, "typeofwater", "watertype")), brewer: str(pick(r, "brewer")),
        dose: num(pick(r, "coffeeg", "dose", "doseg")), waterG: num(pick(r, "waterg", "wateramount")),
        bloomG, bloomS, method, pours: num(pick(r, "pours")), timeS: cellTime(pick(r, "brewtime", "time")),
        rating, taste: tx != null && ty != null ? { x: clamp(tx, -1, 1), y: clamp(ty, -1, 1) } : prev?.taste || null, notes,
      };
      if (!prev && sigs.has(sig(brew))) { nSkipped++; continue; }
      sigs.add(sig(brew)); out.push(brew); nBrews++;
    }
    if (!out.length) {
      closeSheet();
      toast(nSkipped ? `Nothing new. All ${nSkipped} brew${nSkipped === 1 ? " is" : "s are"} already in your log.` : "No brews or bags found in that file.");
      return;
    }
    putRecords(out);
    closeSheet();
    toast(`Imported ${nBrews} brew${nBrews === 1 ? "" : "s"} and ${nBags} bag${nBags === 1 ? "" : "s"}${nSkipped ? `, skipped ${nSkipped} duplicate${nSkipped === 1 ? "" : "s"}` : ""}.`);
    route();
  } catch (e) { console.error(e); toast(e.message || "Couldn't read that file."); }
}

// =====================================================================
// Boot
// =====================================================================
try { applyTheme(); } catch {}
loadStore(LS.get("brewlog:lastEmail"));
const CAN_SYNC = /^https?:$/.test(location.protocol);
setStatus(CAN_SYNC ? "idle" : "local");
window.addEventListener("online", () => scheduleSync(100));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") scheduleSync(100); });
route();
if (CAN_SYNC) {
  sync();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
}
</script>
</body>
